name: Apply Batch Duplicate QA
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/batch-duplicate-qa-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch-duplicate-qa-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_batch_duplicate_qa.py
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit QA gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qc_review.py src/test_main.py
          git commit -m "Enforce batch duplicate holder QA" || exit 0
          git push origin HEAD:fix/batch-duplicate-qa-gate
