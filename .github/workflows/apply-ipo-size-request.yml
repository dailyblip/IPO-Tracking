name: Apply IPO size request

on:
  push:
    branches: [automation/research-monitor-stage-export]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/research-monitor-stage-export
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply researcher-facing IPO size changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Extract the filing's stated aggregate IPO amount when disclosed.
          p = Path('src/filing_parser.py')
          text = p.read_text(encoding='utf-8')
          marker = '\n\nOWNERSHIP_TABLE_HEADER_KEYWORDS = ['
          helper = r'''


def extract_ipo_size_amount(soup: BeautifulSoup):
    """Extract the stated aggregate IPO amount in dollars when disclosed.

    Early S-1s commonly disclose a proposed maximum aggregate offering price
    before a per-share range is available. When that direct amount is absent,
    estimate deal size from offered shares times the midpoint of the disclosed
    preliminary price range.
    """
    full_text = soup.get_text(" ", strip=True)
    patterns = [
        r"proposed\s+maximum\s+aggregate\s+offering\s+price\s*\$\s*([\d,]+(?:\.\d+)?)",
        r"maximum\s+aggregate\s+offering\s+price\s*\$\s*([\d,]+(?:\.\d+)?)",
        r"aggregate\s+offering\s+price\s*\$\s*([\d,]+(?:\.\d+)?)",
    ]
    for pattern in patterns:
        match = re.search(pattern, full_text, re.IGNORECASE)
        if match:
            try:
                value = float(match.group(1).replace(",", ""))
                return value if value > 0 else None
            except ValueError:
                pass

    shares = extract_offering_size(soup)
    price_range = extract_price_range(soup)
    low, high = price_range.get("range_low"), price_range.get("range_high")
    if shares and low and high:
        return shares * ((float(low) + float(high)) / 2.0)
    return None
'''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit('filing_parser insertion marker missing')
              text = text.replace(marker, helper + marker, 1)
          old = '    cover_page_data["offering_size_shares"] = extract_offering_size(soup)\n'
          new = old + '    cover_page_data["ipo_size"] = extract_ipo_size_amount(soup)\n'
          if 'cover_page_data["ipo_size"]' not in text:
              if old not in text:
                  raise SystemExit('filing_parser parse marker missing')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Preserve IPO size in pre-pricing records and the normalized queue.
          replace('src/s1_monitor.py',
              '        price_range = parsed.get("price_range", {})\n        range_label = _format_range(price_range.get("range_low"), price_range.get("range_high"))\n',
              '        price_range = parsed.get("price_range", {})\n        range_label = _format_range(price_range.get("range_low"), price_range.get("range_high"))\n        ipo_size = parsed.get("cover_page", {}).get("ipo_size")\n')
          replace('src/s1_monitor.py',
              '        if range_label:\n            signals.append(f"Preliminary offering range disclosed at {range_label}")\n        else:\n            signals.append("No preliminary price range detected yet")\n',
              '        if range_label:\n            signals.append(f"Preliminary offering range disclosed at {range_label}")\n        else:\n            signals.append("No preliminary price range detected yet")\n        if ipo_size:\n            signals.append(f"IPO size disclosed or estimated at ${ipo_size:,.0f}")\n')
          replace('src/s1_monitor.py',
              '            "price_range": range_label,\n            "signals": signals,\n',
              '            "price_range": range_label,\n            "ipo_size": ipo_size,\n            "signals": signals,\n')
          replace('src/s1_monitor.py',
              '        "price_range": record.get("price_range"),\n        "priority": record.get("priority") or "Medium",\n',
              '        "price_range": record.get("price_range"),\n        "ipo_size": record.get("ipo_size"),\n        "priority": record.get("priority") or "Medium",\n')

          # Export a dedicated IPO size field while retaining existing offering value.
          replace('src/dashboard_export.py',
              '    "priority", "status", "offering_value", "filing_price", "offering_price",\n',
              '    "priority", "status", "ipo_size", "offering_value", "filing_price", "offering_price",\n')
          replace('src/dashboard_export.py',
              '            "stage": "Priced",\n            "priority": _priority(group, people),\n',
              '            "stage": "Priced",\n            "ipo_size": amount or None,\n            "priority": _priority(group, people),\n')
          replace('src/dashboard_export.py',
              '                "status": filing.get("status", ""),\n                "offering_value": filing.get("value", ""),\n',
              '                "status": filing.get("status", ""),\n                "ipo_size": filing.get("ipo_size", filing.get("value", "")),\n                "offering_value": filing.get("value", ""),\n')

          # Add the researcher-facing IPO size column and use the same field in details.
          replace('docs/index.html',
              '<th>Company</th><th>Form</th><th>Filed</th><th>Filing price</th>',
              '<th>Company</th><th>Form</th><th>Filed</th><th>IPO size</th><th>Filing price</th>')
          replace('docs/index.html',
              '<div class="fact"><span>Offering value</span><strong id="detailValue"></strong></div>',
              '<div class="fact"><span>IPO size</span><strong id="detailValue"></strong></div>')
          replace('docs/index.html',
              'appendCell(row,text("span","",dateLabel(filing.filed)));appendCell(row,text("span","quote",filingPrice(filing.price_range||filing.filing_price)));',
              'appendCell(row,text("span","",dateLabel(filing.filed)));appendCell(row,text("span","quote",money(filing.ipo_size||filing.value)));appendCell(row,text("span","quote",filingPrice(filing.price_range||filing.filing_price)));')
          replace('docs/index.html',
              '$("detailValue").textContent=filing.value_label||money(filing.value);',
              '$("detailValue").textContent=money(filing.ipo_size||filing.value);')

          # Focused regression coverage.
          Path('src/test_ipo_size.py').write_text(r'''import csv
import io
import unittest
from bs4 import BeautifulSoup

import dashboard_export
import filing_parser


class IpoSizeTests(unittest.TestCase):
    def test_extracts_stated_aggregate_ipo_size(self):
        soup = BeautifulSoup(
            '<html><body>Proposed Maximum Aggregate Offering Price $100,000,000</body></html>',
            'html.parser',
        )
        self.assertEqual(filing_parser.extract_ipo_size_amount(soup), 100_000_000.0)

    def test_estimates_size_from_shares_and_price_midpoint(self):
        soup = BeautifulSoup(
            '<html><body>We are offering 5,000,000 shares of our common stock. '
            'The price is expected to be between $18.00 and $20.00 per share.</body></html>',
            'html.parser',
        )
        self.assertEqual(filing_parser.extract_ipo_size_amount(soup), 95_000_000.0)

    def test_csv_exposes_ipo_size(self):
        self.assertIn('ipo_size', dashboard_export.CSV_FIELDS)
        rows = list(dashboard_export._csv_rows([{
            'company': 'Example Corp', 'form': 'S-1', 'ipo_size': 100_000_000,
            'people': [],
        }]))
        self.assertEqual(rows[0]['ipo_size'], 100_000_000)

    def test_ui_has_ipo_size_column(self):
        html = open('docs/index.html', encoding='utf-8').read()
        self.assertIn('<th>IPO size</th>', html)
        self.assertIn('money(filing.ipo_size||filing.value)', html)


if __name__ == '__main__':
    unittest.main()
''', encoding='utf-8')

          # Remove this one-shot workflow from the resulting PR diff.
          Path('.github/workflows/apply-ipo-size-request.yml').unlink()
          PY
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py'
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add IPO size to Research Monitor"
          git push
