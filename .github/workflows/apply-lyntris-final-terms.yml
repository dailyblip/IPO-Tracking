name: Apply Lyntris Final Terms QA
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/lyntris-final-terms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lyntris-final-terms
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parser fix
        run: python scripts/apply_lyntris_final_terms_fix.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit parser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/filing_parser.py src/test_filing_parser.py
          git commit -m "Parse Lyntris-style final IPO terms and principal office" || exit 0
          git push origin HEAD:fix/lyntris-final-terms
