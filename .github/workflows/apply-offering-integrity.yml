name: Apply Offering Integrity
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/research-grade-offering-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/research-grade-offering-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final lock-up filter fix
        run: python scripts/fix_lockup_filter.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Reject non-lockup timing false positives" || exit 0
          git push origin HEAD:feature/research-grade-offering-integrity
