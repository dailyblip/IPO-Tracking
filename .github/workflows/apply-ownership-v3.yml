name: Apply ownership grid v3
on:
  push:
    branches: [feature/ownership-grid-v3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Integrate rich ownership fields
        run: |
          python - <<'PY'
          from pathlib import Path

          # filing_parser: prefer the rich structured parser, fall back to legacy
          p=Path('src/filing_parser.py'); s=p.read_text()
          if 'from ownership_parser import extract_rich_stockholders' not in s:
              s=s.replace('from bs4 import BeautifulSoup\n', 'from bs4 import BeautifulSoup\n\nfrom ownership_parser import extract_rich_stockholders\n')
          s=s.replace('"principal_stockholders": extract_principal_stockholders(soup),', '"principal_stockholders": extract_rich_stockholders(soup) or extract_principal_stockholders(soup),')
          p.write_text(s)

          # main: carry the full ownership transition instead of discarding it
          p=Path('src/main.py'); s=p.read_text()
          old='''            shares = holder.get("shares")\n'''
          new='''            shares_before = holder.get("shares_before")\n            shares_sold = holder.get("shares_sold")\n            shares_after = holder.get("shares_after")\n            shares = shares_after if shares_after is not None else holder.get("shares")\n            percent_before = holder.get("percent_before")\n            percent_after = holder.get("percent_after") if holder.get("percent_after") is not None else holder.get("percent")\n'''
          assert old in s; s=s.replace(old,new,1)
          old='''                "Shares": shares,\n                "Cash Value": cash_value,\n'''
          new='''                "Shares": shares,\n                "Shares Before IPO": shares_before,\n                "Shares Sold in IPO": shares_sold,\n                "Shares After IPO": shares_after if shares_after is not None else shares,\n                "Ownership % Before IPO": percent_before,\n                "Ownership % After IPO": percent_after,\n                "Cash Realized IPO": (shares_sold * actual_price) if (shares_sold is not None and actual_price) else None,\n                "Cash Value": cash_value,\n'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          # Prospect metadata: retain both pre/post ownership percentages.
          p=Path('src/prospect_research.py'); s=p.read_text()
          s=s.replace('''        "ownership_percent": first_present(row, "Ownership %", "Percent Ownership", "Percent", "% Ownership"),\n''','''        "ownership_percent": first_present(row, "Ownership % After IPO", "Ownership %", "Percent Ownership", "Percent", "% Ownership"),\n        "ownership_percent_before": first_present(row, "Ownership % Before IPO", "Percent Before IPO"),\n        "ownership_percent_after": first_present(row, "Ownership % After IPO", "Percent After IPO", "Ownership %", "Percent Ownership"),\n''')
          p.write_text(s)

          # dashboard export: allow new fields and preserve actual realized proceeds.
          p=Path('src/dashboard_export.py'); s=p.read_text()
          s=s.replace('''    "holder_type", "role", "ownership_percent", "shares_before_ipo",\n''','''    "holder_type", "role", "ownership_percent", "ownership_percent_before", "ownership_percent_after", "shares_before_ipo",\n''')
          s=s.replace('''    "stanford_university_bio", "holder_type", "role", "ownership_percent",\n''','''    "stanford_university_bio", "holder_type", "role", "ownership_percent", "ownership_percent_before", "ownership_percent_after",\n''')
          old='''            people.append({"name": name, "shares": shares, "cash_value": cash_value, "stanford_university_bio": _boolean(row.get("Stanford University in Bio")), "lockup_end_date": lockup.get("end"), "lockup_scope": "filing-level" if lockup.get("text") else None, "valuation_as_of": first.get("Last Updated") or None, **metadata, **liquidity})'''
          new='''            realized = _number(row.get("Cash Realized IPO"))\n            if realized is not None:\n                liquidity["cash_realized_ipo"] = realized\n            people.append({"name": name, "shares": shares, "cash_value": cash_value, "stanford_university_bio": _boolean(row.get("Stanford University in Bio")), "lockup_end_date": lockup.get("end"), "lockup_scope": "filing-level" if lockup.get("text") else None, "valuation_as_of": first.get("Last Updated") or None, **metadata, **liquidity})'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('''"ownership_percent": person.get("ownership_percent"),\n''','''"ownership_percent": person.get("ownership_percent"), "ownership_percent_before": person.get("ownership_percent_before"), "ownership_percent_after": person.get("ownership_percent_after"),\n''')
          p.write_text(s)

          # Prospect UI: expose the ownership facts directly in the company grid.
          p=Path('docs/prospect-research/index.html'); s=p.read_text()
          old='<th>Owner</th><th>Type</th><th>Role</th><th>Post-IPO shares</th><th>% ownership</th><th>Current value</th><th>Liquid now</th><th>Locked / restricted</th><th>Confidence</th>'
          new='<th>Owner</th><th>Type</th><th>Role</th><th>Before IPO</th><th>Sold in IPO</th><th>After IPO</th><th>% Before</th><th>% After</th><th>IPO Cash Proceeds</th><th>Current Value</th><th>Liquid Now</th><th>Locked / Restricted</th><th>Lock-up</th><th>Confidence</th>'
          assert old in s; s=s.replace(old,new,1)
          old='''[p.holder_type||"Unknown",p.role||"Not disclosed",shareLabel(p.shares_after_ipo??p.shares),p.ownership_percent??"Not disclosed",money(p.cash_value),money(p.liquid_value),money(p.locked_value),p.liquidity_confidence||"Unknown"].forEach(v=>{const c=document.createElement("td");c.textContent=v;tr.append(c)});'''
          new='''[p.holder_type||"Unknown",p.role||"Not disclosed",shareLabel(p.shares_before_ipo),shareLabel(p.shares_sold_ipo),shareLabel(p.shares_after_ipo??p.shares),p.ownership_percent_before??"Not disclosed",p.ownership_percent_after??p.ownership_percent??"Not disclosed",money(p.cash_realized_ipo),money(p.cash_value),money(p.liquid_value),money(p.locked_value),p.lockup_end_date?dateLabel(p.lockup_end_date):(p.lockup_scope==="filing-level"?"Filing-level terms":"Not classified"),p.liquidity_confidence||"Unknown"].forEach(v=>{const c=document.createElement("td");c.textContent=v;tr.append(c)});'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          # Tests for structured parsing and end-to-end field presence.
          Path('src/test_ownership_parser.py').write_text(r'''import unittest\nfrom bs4 import BeautifulSoup\nfrom ownership_parser import parse_ownership_table\n\nclass OwnershipParserTests(unittest.TestCase):\n    def test_wide_before_sold_after_grid(self):\n        html="""<table><tr><th>Name of beneficial owner</th><th colspan='2'>Beneficially owned before offering</th><th>Shares offered</th><th colspan='2'>Beneficially owned after offering</th></tr><tr><th></th><th>Number</th><th>Percent</th><th></th><th>Number</th><th>Percent</th></tr><tr><td>Jane Smith</td><td>1,000,000</td><td>10.0%</td><td>100,000</td><td>900,000</td><td>8.2%</td></tr></table>"""\n        table=BeautifulSoup(html,'lxml').find('table')\n        rows=parse_ownership_table(table)\n        self.assertEqual(len(rows),1)\n        r=rows[0]\n        self.assertEqual(r['shares_before'],1000000)\n        self.assertEqual(r['shares_sold'],100000)\n        self.assertEqual(r['shares_after'],900000)\n        self.assertEqual(r['percent_before'],10.0)\n        self.assertEqual(r['percent_after'],8.2)\n\nif __name__=='__main__': unittest.main()\n'''.replace('\\n','\n'))

          p=Path('src/test_prospect_liquidity_site.py'); s=p.read_text()
          marker='''    def test_researcher_workflow_fields_and_filters(self):'''
          insert='''    def test_company_grid_surfaces_full_ownership_transition(self):\n        for label in ("Before IPO", "Sold in IPO", "After IPO", "% Before", "% After", "IPO Cash Proceeds", "Lock-up"):\n            self.assertIn(label, self.html)\n        self.assertIn("p.shares_before_ipo", self.html)\n        self.assertIn("p.shares_sold_ipo", self.html)\n        self.assertIn("p.cash_realized_ipo", self.html)\n\n'''
          assert marker in s; s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/filing_parser.py src/main.py src/prospect_research.py src/dashboard_export.py src/test_ownership_parser.py src/test_prospect_liquidity_site.py docs/prospect-research/index.html
          git commit -m "Preserve rich beneficial ownership details for prospect research"
          git push
