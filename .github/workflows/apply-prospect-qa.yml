name: Apply Prospect QA
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/prospect-data-qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prospect-data-qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply QA migration
        run: python scripts/apply_prospect_qa.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit QA changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs/prospect-research/index.html
          git commit -m "Harden Prospect Research data integrity and parsing" || exit 0
          git push origin HEAD:fix/prospect-data-qa
