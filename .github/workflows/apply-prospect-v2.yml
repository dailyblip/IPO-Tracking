name: Apply Prospect Research v2
on:
  push:
    branches: [feature/prospect-research-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply Prospect Research data and UI upgrades
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/dashboard_export.py'); s=p.read_text()
          s=s.replace('from pathlib import Path\n', 'from pathlib import Path\n\nfrom prospect_research import prospect_person_metadata\n')
          s=s.replace('"cash_realized_ipo", "liquidity_status", "liquidity_confidence",\n}', '"cash_realized_ipo", "liquidity_status", "liquidity_confidence",\n    "holder_type", "role", "ownership_percent", "shares_before_ipo",\n    "shares_sold_ipo", "shares_after_ipo", "stanford_source",\n    "lockup_end_date", "lockup_scope", "valuation_as_of",\n}')
          s=s.replace('"stanford_university_bio", "sec_url",\n)', '"stanford_university_bio", "holder_type", "role", "ownership_percent",\n    "shares_before_ipo", "shares_sold_ipo", "shares_after_ipo", "stanford_source",\n    "lockup_scope", "valuation_as_of", "sec_url",\n)')
          old='people.append({"name": name, "shares": shares, "cash_value": cash_value, "stanford_university_bio": _boolean(row.get("Stanford University in Bio")), **liquidity})'
          new='metadata = prospect_person_metadata(row, name)\n            people.append({"name": name, "shares": shares, "cash_value": cash_value, "stanford_university_bio": _boolean(row.get("Stanford University in Bio")), "lockup_end_date": lockup.get("end"), "lockup_scope": "filing-level" if lockup.get("text") else None, "valuation_as_of": first.get("Last Updated") or None, **metadata, **liquidity})'
          assert old in s; s=s.replace(old,new)
          old='"stanford_university_bio": person.get(\n                    "stanford_university_bio", False\n                ),\n                "sec_url": filing.get("sec_url", ""),'
          new='"stanford_university_bio": person.get("stanford_university_bio", False),\n                "holder_type": person.get("holder_type"), "role": person.get("role"),\n                "ownership_percent": person.get("ownership_percent"),\n                "shares_before_ipo": person.get("shares_before_ipo"),\n                "shares_sold_ipo": person.get("shares_sold_ipo"), "shares_after_ipo": person.get("shares_after_ipo"),\n                "stanford_source": person.get("stanford_source"), "lockup_scope": person.get("lockup_scope"),\n                "valuation_as_of": person.get("valuation_as_of"),\n                "sec_url": filing.get("sec_url", ""),'
          assert old in s; s=s.replace(old,new)
          p.write_text(s)

          p=Path('docs/prospect-research/index.html'); s=p.read_text()
          s=s.replace('grid-template-columns:minmax(260px,1fr) 170px 170px', 'grid-template-columns:minmax(260px,1fr) 170px 170px 190px')
          s=s.replace('<div class="card"><span>Beneficial owners</span><strong id="peopleMetric">0</strong></div><div class="card"><span>Known offering value</span><strong id="valueMetric">—</strong></div>', '<div class="card"><span>Stanford-linked IPOs</span><strong id="stanfordMetric">0</strong></div><div class="card"><span>Lock-ups ≤90 days</span><strong id="lockupMetric">0</strong></div>')
          s=s.replace('</select></div><div class="table-wrap">', '</select><select class="control" id="researchFilter"><option value="">All research signals</option><option value="major">$500M+ IPO</option><option value="stanford">Stanford connection</option><option value="lockup90">Lock-up ≤90 days</option><option value="selling">Selling shareholders</option></select></div><div class="table-wrap">',1)
          s=s.replace('<th>Person / owner</th><th>Shares</th><th>Current value</th><th>Liquid now</th><th>Locked / restricted</th><th>Confidence</th>', '<th>Owner</th><th>Type</th><th>Role</th><th>Post-IPO shares</th><th>% ownership</th><th>Current value</th><th>Liquid now</th><th>Locked / restricted</th><th>Confidence</th>')
          s=s.replace('<div class="fact"><span>Total shares</span><strong id="totalShares">—</strong></div>', '<div class="fact"><span>Post-IPO shares</span><strong id="totalShares">—</strong></div>')
          s=s.replace('<div class="callout"><span class="sub">Prospect Research takeaway</span><strong id="takeaway">Liquidity not yet classified</strong><div id="takeawayDetail" class="sub"></div></div>', '<div class="callout"><span class="sub">Estimated IPO liquidity event</span><strong id="takeaway">Liquidity not yet classified</strong><div id="takeawayDetail" class="sub"></div></div><div class="callout"><span class="sub">Ownership transition</span><strong id="ownershipTransition">Not disclosed</strong><div class="sub">Before IPO → sold in IPO → after IPO. Values appear only when supported by the filing.</div></div><div class="callout"><span class="sub">Source</span><strong><a id="personSecSource" target="_blank" rel="noopener">SEC filing</a></strong><div id="valuationAsOf" class="sub"></div></div>')
          s=s.replace('function visible(){const q=$("search").value.trim().toLowerCase(),stage=$("stageFilter").value,owner=$("ownerFilter").value;', 'function daysTo(v){if(!v)return null;const d=new Date(v+"T00:00:00Z"),now=new Date();return Math.ceil((d-now)/86400000)}function hasSelling(f){return (f.signals||[]).some(x=>/selling stockholder|secondary/i.test(x))}function visible(){const q=$("search").value.trim().toLowerCase(),stage=$("stageFilter").value,owner=$("ownerFilter").value,research=$("researchFilter").value;')
          s=s.replace('return(!q||hay.includes(q))&&(!stage||f.stage===stage)&&(!owner||(owner==="with"?people.length>0:people.length===0))})}', 'const d=daysTo(f.lockup_end_date);const researchOk=!research||(research==="major"&&isMajor(f))||(research==="stanford"&&hasStanford(f))||(research==="lockup90"&&d!==null&&d>=0&&d<=90)||(research==="selling"&&hasSelling(f));return(!q||hay.includes(q))&&(!stage||f.stage===stage)&&(!owner||(owner==="with"?people.length>0:people.length===0))&&researchOk})}')
          s=s.replace('$("peopleMetric").textContent=filings.reduce((s,f)=>s+(f.people||[]).length,0);$("valueMetric").textContent=money(filings.reduce((s,f)=>s+(Number(f.ipo_size||f.value)||0),0))', '$("stanfordMetric").textContent=filings.filter(hasStanford).length;$("lockupMetric").textContent=filings.filter(f=>{const d=daysTo(f.lockup_end_date);return d!==null&&d>=0&&d<=90}).length')
          old='[shareLabel(p.shares),money(p.cash_value),money(p.liquid_value),money(p.locked_value),p.liquidity_confidence||"Unknown"].forEach(v=>{const c=document.createElement("td");c.textContent=v;tr.append(c)})'
          new='[p.holder_type||"Unknown",p.role||"Not disclosed",shareLabel(p.shares_after_ipo??p.shares),p.ownership_percent??"Not disclosed",money(p.cash_value),money(p.liquid_value),money(p.locked_value),p.liquidity_confidence||"Unknown"].forEach(v=>{const c=document.createElement("td");c.textContent=v;tr.append(c)});if((p.holder_type||"Unknown")!=="Individual"){b.disabled=true;b.title="Entity record — no individual prospect profile"}'
          assert old in s; s=s.replace(old,new)
          s=s.replace('$("totalShares").textContent=shareLabel(p.shares);', '$("totalShares").textContent=shareLabel(p.shares_after_ipo??p.shares);')
          s=s.replace('$("confidence").textContent=p.liquidity_confidence||"Unknown";personDetail.showModal()', 'const before=shareLabel(p.shares_before_ipo),sold=shareLabel(p.shares_sold_ipo),after=shareLabel(p.shares_after_ipo??p.shares);$("ownershipTransition").textContent=`${before} → ${sold} → ${after}`;$("personSecSource").href=selectedCompany.sec_url||"https://www.sec.gov/edgar/search/";$("valuationAsOf").textContent=p.valuation_as_of?`Current-value estimate as of ${dateLabel(p.valuation_as_of)}`:"Current valuation date not available";$("confidence").textContent=p.liquidity_confidence||"Unknown";personDetail.showModal()')
          s=s.replace('for(const id of ["stageFilter","ownerFilter"])', 'for(const id of ["stageFilter","ownerFilter","researchFilter"])')
          p.write_text(s)

          p=Path('src/test_prospect_liquidity_site.py'); s=p.read_text()
          insert='''\n    def test_researcher_workflow_fields_and_filters(self):\n        for label in ("Stanford-linked IPOs", "Lock-ups ≤90 days", "$500M+ IPO", "Selling shareholders", "Type", "Role", "% ownership", "Ownership transition", "Estimated IPO liquidity event", "Current valuation date not available"):\n            self.assertIn(label, self.html)\n        self.assertIn('id="researchFilter"', self.html)\n        self.assertIn('p.holder_type||"Unknown"', self.html)\n        self.assertIn('Entity record — no individual prospect profile', self.html)\n'''
          s=s.replace('\n\nif __name__ == "__main__":', insert+'\n\nif __name__ == "__main__":')
          p.write_text(s)

          Path('src/test_prospect_research.py').write_text('''import unittest\nfrom prospect_research import holder_type, prospect_person_metadata\n\nclass ProspectResearchTests(unittest.TestCase):\n    def test_holder_type_distinguishes_people_from_entities(self):\n        self.assertEqual(holder_type("Jane Smith"), "Individual")\n        self.assertEqual(holder_type("Example Ventures LP"), "Fund")\n        self.assertEqual(holder_type("Smith Family Trust"), "Trust")\n    def test_metadata_preserves_only_available_research_facts(self):\n        row={"Title":"CEO", "Percent Ownership":"12.4%", "Shares":"100", "Stanford Justification":"Stanford bio"}\n        m=prospect_person_metadata(row,"Jane Smith")\n        self.assertEqual(m["role"],"CEO")\n        self.assertEqual(m["ownership_percent"],"12.4%")\n        self.assertEqual(m["shares_after_ipo"],"100")\n        self.assertEqual(m["stanford_source"],"Stanford bio")\n\nif __name__ == "__main__": unittest.main()\n''')
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard_export.py src/test_prospect_liquidity_site.py src/test_prospect_research.py docs/prospect-research/index.html
          git commit -m "Upgrade Prospect Research workflow and holder metadata"
          git push
