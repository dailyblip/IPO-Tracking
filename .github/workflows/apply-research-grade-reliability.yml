name: Apply Research Grade Reliability
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/research-grade-reliability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/research-grade-reliability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reliability migration
        run: |
          python scripts/apply_research_grade_reliability.py
          python scripts/fix_reliability_migration.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit reliability changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs/prospect-research
          git commit -m "Make Prospect Research lock-up data research-grade" || exit 0
          git push origin HEAD:feature/research-grade-reliability
