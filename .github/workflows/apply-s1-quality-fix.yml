name: Apply S-1 ingestion quality fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-s1-quality-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s1-ingestion-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch S-1 ingestion and dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('src/s1_monitor.py')
          s = p.read_text(encoding='utf-8')

          anchor = '''def _clean_company_name(value: str) -> str:\n    return " ".join(str(value or "").split()).strip()\n'''
          addition = '''def _clean_company_name(value: str) -> str:\n    return " ".join(str(value or "").split()).strip()\n\n\ndef _normalize_filing_date(value: str) -> str:\n    raw = str(value or "").strip()\n    if re.fullmatch(r"\\d{8}", raw):\n        return f"{raw[:4]}-{raw[4:6]}-{raw[6:8]}"\n    return raw\n\n\ndef _format_fixed_price(value) -> str | None:\n    try:\n        value = float(value)\n    except (TypeError, ValueError):\n        return None\n    if value <= 0:\n        return None\n    return f"${value:,.2f}"\n\n\ndef _is_micro_self_underwritten_offering(filing_text: str, parsed: dict, ipo_size) -> bool:\n    """Exclude tiny self-underwritten/best-efforts registrations without an exchange listing."""\n    try:\n        amount = float(ipo_size or 0)\n    except (TypeError, ValueError):\n        amount = 0\n    if not (0 < amount < 1_000_000):\n        return False\n    text = " ".join(str(filing_text or "").lower().split())[:80000]\n    self_sold = (\n        "self-underwritten" in text\n        or "self underwritten" in text\n        or "best-efforts basis" in text\n        or "best efforts basis" in text\n    )\n    cover = parsed.get("cover_page", {}) if isinstance(parsed, dict) else {}\n    exchange = str(cover.get("exchange") or "").strip()\n    return self_sold and not exchange\n'''
          assert anchor in s
          s = s.replace(anchor, addition, 1)
          s = s.replace('"filing_date": filing_date.strip(),', '"filing_date": _normalize_filing_date(filing_date),', 1)
          s = s.replace('''        if amount >= 1_000_000:\n            return int(round(amount))''', '''        if amount > 0:\n            return int(round(amount))''', 1)
          old = '''    if low > 0 and high > 0:\n        return int(round(shares * ((low + high) / 2)))\n    return None'''
          new = '''    if low > 0 and high > 0:\n        return int(round(shares * ((low + high) / 2)))\n    try:\n        fixed_price = float(cover.get("offering_price") or 0)\n    except (TypeError, ValueError):\n        fixed_price = 0\n    if fixed_price > 0:\n        return int(round(shares * fixed_price))\n    return None'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        price_range = parsed.get("price_range", {})\n        range_label = _format_range(price_range.get("range_low"), price_range.get("range_high"))\n        ipo_size = _extract_ipo_size(filing_text, parsed, price_range)\n\n        ticker = None'''
          new = '''        price_range = parsed.get("price_range", {})\n        range_label = _format_range(price_range.get("range_low"), price_range.get("range_high"))\n        cover = parsed.get("cover_page", {}) if isinstance(parsed, dict) else {}\n        fixed_price_label = _format_fixed_price(cover.get("offering_price"))\n        ipo_size = _extract_ipo_size(filing_text, parsed, price_range)\n        if _is_micro_self_underwritten_offering(filing_text, parsed, ipo_size):\n            print(f"[s1_monitor] Skipping {company}: micro self-underwritten/best-efforts registration without exchange listing")\n            return None\n\n        ticker = None'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        if range_label:\n            signals.append(f"Preliminary offering range disclosed at {range_label}")\n        else:\n            signals.append("No preliminary price range detected yet")'''
          new = '''        if range_label:\n            signals.append(f"Preliminary offering range disclosed at {range_label}")\n        elif fixed_price_label:\n            signals.append(f"Fixed offering price disclosed at {fixed_price_label} per share")\n        else:\n            signals.append("No preliminary price range or fixed offering price detected yet")'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('''            "filed": meta.get("filing_date") or "",\n            "stage": "Pre-pricing",\n            "priority": "High" if range_label else "Medium",\n            "price_range": range_label,''', '''            "filed": _normalize_filing_date(meta.get("filing_date") or ""),\n            "stage": "Pre-pricing",\n            "priority": "High" if (range_label or fixed_price_label) else "Medium",\n            "price_range": range_label,\n            "filing_price": fixed_price_label,''', 1)
          s = s.replace('''        "filed": record.get("filed") or "",\n        "stage": record.get("stage") or "Pre-pricing",\n        "price_range": record.get("price_range"),''', '''        "filed": _normalize_filing_date(record.get("filed") or ""),\n        "stage": record.get("stage") or "Pre-pricing",\n        "price_range": record.get("price_range"),\n        "filing_price": record.get("filing_price"),''', 1)
          s = s.replace('''def sync_research_queue(records: list[dict], queue_path: Path = QUEUE_PATH) -> dict:\n    """Merge current S-1 signals into the main researcher queue atomically."""''', '''def sync_research_queue(\n    records: list[dict], queue_path: Path = QUEUE_PATH, processed_ciks: set[str] | None = None\n) -> dict:\n    """Merge current S-1 signals into the queue and prune processed records that no longer qualify."""''', 1)
          old = '''    merged = {\n        item["id"]: item\n        for item in existing\n        if isinstance(item, dict)\n        and item.get("id")\n        and not (\n            str(item.get("id", "")).startswith("s1:")\n            and str(item.get("cik") or "").zfill(10) in priced_ciks\n        )\n    }'''
          new = '''    processed_ciks = {str(cik or "").zfill(10) for cik in (processed_ciks or set()) if cik}\n    for item in existing:\n        if isinstance(item, dict) and str(item.get("id", "")).startswith("s1:"):\n            item["filed"] = _normalize_filing_date(item.get("filed") or "")\n\n    merged = {\n        item["id"]: item\n        for item in existing\n        if isinstance(item, dict)\n        and item.get("id")\n        and not (\n            str(item.get("id", "")).startswith("s1:")\n            and (\n                str(item.get("cik") or "").zfill(10) in priced_ciks\n                or str(item.get("cik") or "").zfill(10) in processed_ciks\n            )\n        )\n    }'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('''    queue = sync_research_queue(records)''', '''    processed_ciks = {str(meta.get("cik") or "").zfill(10) for meta in candidates if meta.get("cik")}\n    queue = sync_research_queue(records, processed_ciks=processed_ciks)''', 1)
          p.write_text(s, encoding='utf-8')

          # Make legacy YYYYMMDD values display correctly immediately.
          hp = Path('docs/index.html')
          h = hp.read_text(encoding='utf-8')
          old_date = '''function dateLabel(value){if(!value)return "—";const raw=String(value),d=/^\\d{4}-\\d{2}-\\d{2}$/.test(raw)?new Date(`${raw}T00:00:00Z`):new Date(raw);return Number.isNaN(d.getTime())?raw:new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}).format(d)}'''
          new_date = '''function dateLabel(value){if(!value)return "—";const raw=String(value),normalized=/^\\d{8}$/.test(raw)?`${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`:raw,d=/^\\d{4}-\\d{2}-\\d{2}$/.test(normalized)?new Date(`${normalized}T00:00:00Z`):new Date(normalized);return Number.isNaN(d.getTime())?raw:new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}).format(d)}'''
          assert old_date in h
          h = h.replace(old_date, new_date, 1)
          hp.write_text(h, encoding='utf-8')

          # Clean current public queue: normalize S-1 dates and remove the verified non-qualifying Sensei case.
          dp = Path('docs/data/filings.json')
          payload = json.loads(dp.read_text(encoding='utf-8'))
          cleaned = []
          for item in payload.get('filings', []):
              if str(item.get('cik') or '').zfill(10) == '0002112634':
                  continue
              if str(item.get('id') or '').startswith('s1:'):
                  raw = str(item.get('filed') or '')
                  if len(raw) == 8 and raw.isdigit():
                      item['filed'] = f'{raw[:4]}-{raw[4:6]}-{raw[6:8]}'
              cleaned.append(item)
          payload['filings'] = cleaned
          dp.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          tp = Path('src/test_s1_monitor.py')
          t = tp.read_text(encoding='utf-8')
          insert_after = '''    def test_format_range(self):\n        self.assertEqual(s1_monitor._format_range("18", "20"), "$18.00–$20.00")\n        self.assertIsNone(s1_monitor._format_range(None, "20"))\n'''
          tests = '''    def test_format_range(self):\n        self.assertEqual(s1_monitor._format_range("18", "20"), "$18.00–$20.00")\n        self.assertIsNone(s1_monitor._format_range(None, "20"))\n\n    def test_normalizes_compact_filing_date(self):\n        self.assertEqual(s1_monitor._normalize_filing_date("20260818"), "2026-08-18")\n        self.assertEqual(s1_monitor._normalize_filing_date("2026-08-18"), "2026-08-18")\n\n    def test_extracts_sub_million_aggregate_offering_size(self):\n        value = s1_monitor._extract_ipo_size(\n            "Proposed Maximum Aggregate Offering Price $120,000", {}, {}\n        )\n        self.assertEqual(value, 120_000)\n\n    def test_derives_fixed_price_offering_size(self):\n        value = s1_monitor._extract_ipo_size(\n            "Initial public offering",\n            {"cover_page": {"offering_size_shares": 6_000_000, "offering_price": 0.02}},\n            {},\n        )\n        self.assertEqual(value, 120_000)\n\n    def test_micro_self_underwritten_registration_without_exchange_is_rejected(self):\n        self.assertTrue(s1_monitor._is_micro_self_underwritten_offering(\n            "The offering is being conducted on a self-underwritten, best-efforts basis.",\n            {"cover_page": {"exchange": None}},\n            120_000,\n        ))\n        self.assertFalse(s1_monitor._is_micro_self_underwritten_offering(\n            "The offering is being conducted on a best-efforts basis.",\n            {"cover_page": {"exchange": "Nasdaq"}},\n            120_000,\n        ))\n'''
          assert insert_after in t
          t = t.replace(insert_after, tests, 1)
          # Ensure parsed cover data is present in the existing preliminary-range test fixture.
          t = t.replace('parse_filing.return_value = {"price_range": {"range_low": 18, "range_high": 20}}', 'parse_filing.return_value = {"price_range": {"range_low": 18, "range_high": 20}, "cover_page": {"exchange": "Nasdaq", "offering_price": None}}', 1)
          marker = '''    def test_sync_queue_removes_prepricing_row_after_424b4(self):\n'''
          extra = '''    def test_sync_queue_prunes_processed_s1_that_no_longer_qualifies(self):\n        stale = {\n            "id": "s1:0002112634",\n            "company": "Sensei Harbor Corp.",\n            "cik": "0002112634",\n            "form": "S-1/A",\n            "filed": "20260818",\n        }\n        with tempfile.TemporaryDirectory() as tmp:\n            path = Path(tmp) / "filings.json"\n            path.write_text(json.dumps({"filings": [stale]}), encoding="utf-8")\n            payload = s1_monitor.sync_research_queue([], path, processed_ciks={"2112634"})\n            self.assertEqual(payload["filings"], [])\n\n'''
          assert marker in t
          t = t.replace(marker, extra + marker, 1)
          tp.write_text(t, encoding='utf-8')

          # Update UI date regression coverage for compact SEC dates.
          up = Path('src/test_dashboard_ui.py')
          u = up.read_text(encoding='utf-8')
          needle = '''    def test_filed_date_uses_friendly_format(self):\n        self.assertIn('month:"short",day:"numeric",year:"numeric"', self.html)\n        self.assertIn('dateLabel(filing.filed)', self.html)\n'''
          repl = '''    def test_filed_date_uses_friendly_format(self):\n        self.assertIn('month:"short",day:"numeric",year:"numeric"', self.html)\n        self.assertIn('dateLabel(filing.filed)', self.html)\n        self.assertIn('/^\\\\d{8}$/.test(raw)', self.html)\n'''
          assert needle in u
          u = u.replace(needle, repl, 1)
          up.write_text(u, encoding='utf-8')
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/s1_monitor.py src/test_s1_monitor.py src/test_dashboard_ui.py docs/index.html docs/data/filings.json
          git commit -m "Improve S-1 ingestion quality and date handling"
          git push origin HEAD:fix/s1-ingestion-quality
