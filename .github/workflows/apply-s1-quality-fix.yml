name: Apply S-1 ingestion quality fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-s1-quality-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s1-ingestion-quality
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_s1_quality_fix.py
      - name: Remove temporary patch script
        run: rm tools/apply_s1_quality_fix.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve S-1 ingestion quality and date handling"
          git push origin HEAD:fix/s1-ingestion-quality

# trigger
