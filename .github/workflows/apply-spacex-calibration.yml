name: Apply SpaceX calibration
on:
  push:
    branches: [feature/prospect-calibration-spacex]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply calibration
        run: python scripts/apply_spacex_calibration.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prospect-research/index.html docs/prospect-research/backfill.json src/test_prospect_liquidity_site.py
          git commit -m "Calibrate Prospect Research with verified SpaceX ownership and lock-up data"
          git push
