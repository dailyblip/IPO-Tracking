name: Apply Stanford Confirmation Fix
on:
  pull_request:
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/stanford-confirmation-threshold'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stanford-confirmation-threshold
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python scripts/fix_stanford_confirmation.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.py src/test_main.py
          git commit -m "Require grade 5 for confirmed Stanford affiliation" || exit 0
          git push origin HEAD:fix/stanford-confirmation-threshold
