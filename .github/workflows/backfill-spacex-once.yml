name: Backfill SpaceX IPO once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/backfill-spacex-once.yml']

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Insert verified SpaceX IPO record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/filings.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          spacex={
            'id':'0001628280-26-042639',
            'company':'Space Exploration Technologies Corp.',
            'ticker':'SPCX',
            'cik':'0001181412',
            'accession_no':'0001628280-26-042639',
            'form':'424B4',
            'filed':'2026-06-12',
            'stage':'Priced',
            'priority':'High',
            'status':'New',
            'ipo_size':74999999925,
            'value':74999999925,
            'value_label':'$75B',
            'filing_price':'135.00',
            'offering_price':135.0,
            'current_price':None,
            'country':'United States',
            'city':'Starbase',
            'state':'TX',
            'people_count':8,
            'signals':[
              '8 named beneficial owners, executives, or directors disclosed in the principal ownership table',
              'Base IPO offering approximately $75B at $135.00 per share',
              '555,555,555 Class A shares offered, with an 83,333,333-share over-allotment option',
              'Controlled-company structure: Elon Musk retains majority voting control',
              'Lock-up terms include a 366-day lock-up for Elon Musk and staggered releases for other holders',
              'Stanford affiliation confirmed for disclosed beneficial owners/directors Ira Ehrenpreis and Steve Jurvetson'
            ],
            'people':[
              {'name':'Elon Musk','shares':6418547515.0,'cash_value':None,'stanford_university_bio':False},
              {'name':'Gwynne Shotwell','shares':12873160.0,'cash_value':None,'stanford_university_bio':False},
              {'name':'Bret Johnsen','shares':9048565.0,'cash_value':None,'stanford_university_bio':False},
              {'name':'Ira Ehrenpreis','shares':1373700.0,'cash_value':None,'stanford_university_bio':True},
              {'name':'Randy Glein','shares':277800.0,'cash_value':None,'stanford_university_bio':False},
              {'name':'Antonio J. Gracias','shares':503414530.0,'cash_value':None,'stanford_university_bio':False},
              {'name':'Steve Jurvetson','shares':0.0,'cash_value':None,'stanford_university_bio':True},
              {'name':'Luke Nosek','shares':32987360.0,'cash_value':None,'stanford_university_bio':False}
            ],
            'sec_url':'https://www.sec.gov/Archives/edgar/data/1181412/000162828026042639/0001628280-26-042639-index.htm'
          }
          filings=[f for f in data.get('filings',[]) if f.get('cik')!='0001181412' and f.get('accession_no')!='0001628280-26-042639']
          filings.append(spacex)
          filings.sort(key=lambda f:str(f.get('filed') or ''), reverse=True)
          data['filings']=filings
          p.write_text(json.dumps(data,indent=2)+"\n",encoding='utf-8')
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit verified backfill
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/filings.json
          git commit -m 'Backfill verified SpaceX IPO'
          git push
