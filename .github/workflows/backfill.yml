name: Backfill Historical IPOs (Manual)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill from this date (YYYY-MM-DD)'
        required: true
        default: '2026-06-01'
      end_date:
        description: 'Backfill through this date (YYYY-MM-DD, blank = today)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Shared with daily.yml so two feed publishers can never race.
  group: daily-ipo-tracker
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      BACKFILL_START: ${{ github.event.inputs.start_date }}
      BACKFILL_END: ${{ github.event.inputs.end_date }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Resolve backfill range
        run: |
          if [ -z "$BACKFILL_END" ]; then
            echo "BACKFILL_END=$(date -u +%F)" >> "$GITHUB_ENV"
          fi

      - name: Run backfill
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: >
          python main.py
          --backfill-start "$BACKFILL_START"
          --backfill-end "$BACKFILL_END"

      - name: Validate and summarize public feed
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          feed = json.loads(Path("docs/data/filings.json").read_text())
          rows = feed.get("filings")
          if not isinstance(rows, list):
              raise SystemExit("docs/data/filings.json must contain a filings list")

          filing_fields = {
              "id", "company", "ticker", "cik", "accession_no", "form", "filed",
              "priority", "status", "value", "value_label", "people_count",
              "signals", "people", "sec_url", "stage", "price_range",
              "filing_price", "offering_price", "current_price", "price_updated",
          }
          person_fields = {
              "name", "shares", "cash_value", "stanford_university_bio",
          }
          seen_ids = set()
          for filing in rows:
              unexpected = set(filing) - filing_fields
              if unexpected:
                  raise SystemExit(f"Non-public filing fields found: {sorted(unexpected)}")
              if not filing.get("id") or not filing.get("company"):
                  raise SystemExit("Every published filing requires an id and company")
              if filing.get("id") in seen_ids:
                  raise SystemExit(f"Duplicate filing id: {filing['id']}")
              seen_ids.add(filing["id"])
              if filing.get("form") not in {"424B4", "S-1", "S-1/A"}:
                  raise SystemExit(f"Unexpected form for {filing['id']}: {filing.get('form')}")
              people = filing.get("people")
              if not isinstance(people, list):
                  raise SystemExit(f"People must be a list for {filing['id']}")
              for person in people:
                  unexpected = set(person) - person_fields
                  if unexpected:
                      raise SystemExit(f"Non-public person fields found: {sorted(unexpected)}")
                  lowered = str(person.get("name", "")).lower()
                  if (
                      "as a group" in lowered
                      and "director" in lowered
                      and "executive officer" in lowered
                  ):
                      raise SystemExit(f"Aggregate ownership row published for {filing['id']}")

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("## Research Monitor backfill\n\n")
              handle.write(f"- Range: {os.environ['BACKFILL_START']} through {os.environ['BACKFILL_END']}\n")
              handle.write(f"- Public feed filings after range replacement: {len(rows)}\n")
          print(f"Validated public feed with {len(rows)} qualifying filings.")
          PY

      - name: Publish Research Monitor data
        run: |
          echo "Publishing corrected range $BACKFILL_START through $BACKFILL_END."
          if git diff --quiet -- docs/data/filings.json docs/data/filings.csv; then
            echo "Research Monitor data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/filings.json docs/data/filings.csv
          git commit -m "Backfill Research Monitor data through $BACKFILL_END"
          git pull --rebase origin main
          git push origin HEAD:main
