name: Backfill Historical IPOs (Manual)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill from this date (YYYY-MM-DD)'
        required: true
        default: '2026-06-01'
      end_date:
        description: 'Backfill through this date (YYYY-MM-DD, blank = today)'
        required: false
        default: ''

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: >
          python main.py
          --backfill-start "${{ github.event.inputs.start_date }}"
          --backfill-end "${{ github.event.inputs.end_date }}"
