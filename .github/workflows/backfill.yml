name: Backfill Historical IPOs (Manual)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill from this date (YYYY-MM-DD)'
        required: true
        default: '2026-06-01'
      end_date:
        description: 'Backfill through this date (YYYY-MM-DD, blank = today)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Shared with daily.yml so two feed publishers can never race.
  group: research-monitor-feed-writers
  cancel-in-progress: false
  queue: max

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      BACKFILL_START: ${{ github.event.inputs.start_date }}
      BACKFILL_END: ${{ github.event.inputs.end_date }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The checked-in feed can lag a newly merged release-policy repair. Normalize
      # it before tests so a manual replay never starts from a state current code
      # would refuse to publish.
      - name: Reconcile checked-in feed with current release policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json

      - name: Run unit tests
        env:
          SKIP_LIVE_GOLDEN: '1'
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Resolve backfill range
        run: |
          if [ -z "$BACKFILL_END" ]; then
            echo "BACKFILL_END=$(date -u +%F)" >> "$GITHUB_ENV"
          fi

      - name: Refresh current pre-pricing S-1 queue
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python s1_monitor.py 4

      - name: Run backfill
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STANFORD_RESEARCH_CACHE_PATH: ../docs/data/stanford_research_cache.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: >
          python main.py
          --backfill-start "$BACKFILL_START"
          --backfill-end "$BACKFILL_END"

      # Manual historical replacement must pass the same release-safety chain as
      # daily regeneration. These steps repair authoritative fields where possible
      # and fail closed on unsupported/stale secondary data; they do not widen the
      # requested historical range or initiate any additional backfill.
      - name: Clear market quotes not refreshed in this run
        working-directory: src
        run: python market_price_freshness_gate.py ../docs/data/filings.json

      - name: Reconcile final 424B4 lifecycle transitions
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python lifecycle_reconciler.py ../docs/data/filings.json

      - name: Reconcile authoritative IPO pricing dates
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python pricing_date_reconciler.py ../docs/data/filings.json

      - name: Sanitize impossible lifecycle dates
        working-directory: src
        run: python lifecycle_date_sanitizer.py ../docs/data/filings.json

      - name: Remove unresolved final pricing states
        working-directory: src
        run: python final_pricing_release_gate.py ../docs/data/filings.json

      - name: Remove post-reporting follow-on/resale offerings
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python followon_sanitizer.py ../docs/data/filings.json

      - name: Normalize issuer display names
        working-directory: src
        run: python company_name_normalizer.py ../docs/data/filings.json

      - name: Enforce public-feed eligibility policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json

      - name: Preserve authoritative final offering aggregates
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python offering_value_reconciler.py ../docs/data/filings.json

      - name: Repair malformed issuer locations
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python location_quality.py ../docs/data/filings.json

      - name: Recover authoritative preliminary filing-price ranges
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python filing_price_history.py ../docs/data/filings.json

      - name: Remove market quotes from pre-pricing records
        working-directory: src
        run: python prepricing_quote_sanitizer.py ../docs/data/filings.json

      - name: Verify market quote issuer identity
        working-directory: src
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        # Current Price is secondary data. If identity verification is unavailable
        # after bounded retries, clear unverified quote-derived fields rather than
        # publishing a ticker/provider collision.
        run: python market_quote_release_gate.py ../docs/data/filings.json

      # Validate the exact post-backfill candidate feed, not only the snapshot that
      # existed before regeneration.
      - name: Run release-blocking regression suite on generated feed
        env:
          SKIP_LIVE_GOLDEN: '1'
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Validate generated lifecycle uniqueness
        run: python -m unittest discover -s src -p 'test_issuer_row_consistency.py' -v

      - name: Validate V1 public feed schema
        run: python src/feed_schema_contract.py docs/data/filings.json

      - name: Validate refreshed golden records
        run: python -m unittest discover -s src -p 'test_golden_records.py' -v

      - name: Refresh stateful research alerts
        run: python src/research_alerts.py

      - name: Summarize public feed
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          feed = json.loads(Path("docs/data/filings.json").read_text())
          rows = feed.get("filings")
          if not isinstance(rows, list):
              raise SystemExit("docs/data/filings.json must contain a filings list")

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          forms = Counter(row.get("form") for row in rows)
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("## Research Monitor backfill\n\n")
              handle.write(f"- Range: {os.environ['BACKFILL_START']} through {os.environ['BACKFILL_END']}\n")
              handle.write(f"- Public feed filings after range replacement and release gates: {len(rows)}\n")
              handle.write(f"- Forms: {dict(forms)}\n")
          print(f"Validated public feed with {len(rows)} qualifying filings.")
          PY

      - name: Publish Research Monitor data
        run: |
          echo "Publishing corrected range $BACKFILL_START through $BACKFILL_END."
          if [ -z "$(git status --short -- docs/data/s1_watch.json docs/data/filings.json docs/data/filings.csv docs/data/stanford_research_cache.json docs/data/alerts.json docs/data/alerts_state.json)" ]; then
            echo "Research Monitor data is unchanged."
            exit 0
          fi

          # Do not rebase a stale historical reconstruction over newer main data.
          # A skipped publish is safe and can be rerun against the new head.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; skipping stale backfill publication."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/s1_watch.json docs/data/filings.json docs/data/filings.csv docs/data/stanford_research_cache.json docs/data/alerts.json docs/data/alerts_state.json
          git commit -m "Backfill Research Monitor data through $BACKFILL_END"
          git push origin HEAD:main
