name: Daily IPO Tracker

permissions:
  contents: write

concurrency:
  group: research-monitor-feed-writers
  cancel-in-progress: false
  queue: max

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    # 12:00 UTC = ~7-8am US Eastern depending on DST. Adjust as needed.
    - cron: '0 12 * * 1-5'
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: DEBUG - list repo contents
        run: ls -la

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Run daily pipeline
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        # Re-evaluate a rolling window so recently missed filings can self-heal
        # after parser/data-quality improvements instead of aging out permanently.
        run: python main.py 14

      - name: Reconcile final 424B4 lifecycle transitions
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python lifecycle_reconciler.py ../docs/data/filings.json

      - name: Sanitize impossible lifecycle dates
        working-directory: src
        run: python lifecycle_date_sanitizer.py ../docs/data/filings.json

      - name: Remove post-reporting follow-on/resale offerings
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python followon_sanitizer.py ../docs/data/filings.json

      - name: Enforce public-feed eligibility policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json

      - name: Repair malformed issuer locations
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python location_quality.py ../docs/data/filings.json

      - name: Recover authoritative preliminary filing-price ranges
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python filing_price_history.py ../docs/data/filings.json

      - name: Remove market quotes from pre-pricing records
        working-directory: src
        run: python prepricing_quote_sanitizer.py ../docs/data/filings.json

      - name: Verify market quote issuer identity
        working-directory: src
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: python market_quote_identity.py ../docs/data/filings.json

      - name: Validate generated lifecycle uniqueness
        run: python -m unittest discover -s src -p 'test_issuer_row_consistency.py' -v

      - name: Publish Research Monitor data
        run: |
          if git diff --quiet -- docs/data/filings.json docs/data/filings.csv; then
            echo "Research Monitor data is unchanged."
            exit 0
          fi

          # Generated feed files are not safe to auto-merge. If main advanced while
          # this run was processing, discard this stale publication and let the next
          # run regenerate from the newer repository state rather than risking a
          # conflict resolution that could publish mixed or stale data.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; skipping stale feed publication."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/filings.json docs/data/filings.csv
          git commit -m "Update Research Monitor data"
          git push origin HEAD:main