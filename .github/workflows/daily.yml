name: Daily IPO Tracker

permissions:
  contents: write

concurrency:
  group: research-monitor-feed-writers
  cancel-in-progress: false
  queue: max

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'schemas/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    # 12:00 UTC = ~7-8am US Eastern depending on DST. Adjust as needed.
    - cron: '0 12 * * 1-5'
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    # The SEC/market-data release chain is intentionally fail-closed and can
    # legitimately need extra time when external providers retry transient 5xx
    # responses. Keep enough headroom for identity validation to finish rather
    # than cancelling the job before release-blocking checks can report a result.
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: DEBUG - list repo contents
        run: ls -la

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Release-safety code can make a previously checked-in row newly ineligible.
      # Reconcile that stale snapshot before published-feed integrity tests run so
      # the writer can self-heal rather than failing before it reaches the policy.
      - name: Reconcile checked-in feed with current release policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json

      # Daily can be triggered by a resale-classifier repair before the serialized
      # S-1 writer gets its turn. Apply the same deterministic S-1 release gates to
      # the checked-in queue here so a known resale-only registration cannot be
      # republished during that gap.
      - name: Reconcile resale-only S-1 amendments by registration history
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python s1_registration_history_gate.py ../docs/data/s1_watch.json ../docs/data/filings.json

      - name: Reconcile resale-only S-1 registrations before daily regeneration
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python resale_registration_sanitizer.py ../docs/data/s1_watch.json ../docs/data/filings.json

      - name: Run unit tests
        env:
          SKIP_LIVE_GOLDEN: '1'
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Run daily pipeline
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STANFORD_RESEARCH_CACHE_PATH: ../docs/data/stanford_research_cache.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        # Re-evaluate a rolling window so recently missed filings can self-heal
        # after parser/data-quality improvements instead of aging out permanently.
        run: python main.py 14

      # main.py can regenerate queue rows that were not present in the checked-in
      # S-1 watch snapshot. Re-run the SEC registration/reporting-history gate on
      # the regenerated queue so an already-public or resale-lineage issuer cannot
      # be reintroduced after the pre-regeneration safety pass.
      - name: Reconcile regenerated S-1 registration history
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python s1_registration_history_gate.py ../docs/data/s1_watch.json ../docs/data/filings.json

      - name: Verify fixed pre-pricing Filing Prices against SEC cover terms
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python s1_preliminary_price_gate.py ../docs/data/s1_watch.json ../docs/data/filings.json

      - name: Clear market quotes not refreshed in this run
        working-directory: src
        run: python market_price_freshness_gate.py ../docs/data/filings.json

      - name: Reconcile final 424B4 lifecycle transitions
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python lifecycle_reconciler.py ../docs/data/filings.json

      - name: Reconcile authoritative IPO pricing dates
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python pricing_date_reconciler.py ../docs/data/filings.json

      - name: Sanitize impossible lifecycle dates
        working-directory: src
        run: python lifecycle_date_sanitizer.py ../docs/data/filings.json

      # A final 424B4 proves the issuer is no longer pre-pricing, but the row is
      # publishable only after the preceding repair passes establish a canonical
      # Pricing Date and positive Final IPO Price. Unknown size remains allowed.
      - name: Remove unresolved final pricing states
        working-directory: src
        run: python final_pricing_release_gate.py ../docs/data/filings.json

      - name: Remove post-reporting follow-on/resale offerings
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python followon_sanitizer.py ../docs/data/filings.json

      - name: Normalize issuer display names
        working-directory: src
        run: python company_name_normalizer.py ../docs/data/filings.json

      - name: Enforce public-feed eligibility policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json

      - name: Preserve authoritative final offering aggregates
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python offering_value_reconciler.py ../docs/data/filings.json

      - name: Repair malformed issuer locations
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python location_quality.py ../docs/data/filings.json

      - name: Recover authoritative preliminary filing-price ranges
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python filing_price_history.py ../docs/data/filings.json

      - name: Remove market quotes from pre-pricing records
        working-directory: src
        run: python prepricing_quote_sanitizer.py ../docs/data/filings.json

      - name: Verify market quote issuer identity
        working-directory: src
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        # Current Price is secondary data. If Finnhub identity verification is
        # unavailable after bounded retries, clear unverified quote-derived fields
        # rather than blocking authoritative SEC IPO data from publication.
        # The release wrapper delegates to the strict implementation formerly run as:
        # run: python market_quote_identity.py ../docs/data/filings.json
        run: python market_quote_release_gate.py ../docs/data/filings.json

      # The startup unit-test pass validates code against the checked-in snapshot.
      # Run the same release-blocking suite again after regeneration and all
      # sanitizers so the exact candidate feed must pass before it can be published.
      - name: Run release-blocking regression suite on generated feed
        env:
          SKIP_LIVE_GOLDEN: '1'
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Validate generated lifecycle uniqueness
        run: python -m unittest discover -s src -p 'test_issuer_row_consistency.py' -v

      - name: Validate V1 public feed schema
        run: python src/feed_schema_contract.py docs/data/filings.json

      - name: Validate refreshed golden records
        run: python -m unittest discover -s src -p 'test_golden_records.py' -v

      - name: Publish Research Monitor data
        run: |
          if git diff --quiet -- docs/data/filings.json docs/data/filings.csv docs/data/stanford_research_cache.json; then
            echo "Research Monitor data is unchanged."
            exit 0
          fi

          # Generated feed files are not safe to auto-merge. If main advanced while
          # this run was processing, discard this stale publication and let the next
          # run regenerate from the newer repository state rather than risking a
          # conflict resolution that could publish mixed or stale data.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; skipping stale feed publication."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/filings.json docs/data/filings.csv docs/data/stanford_research_cache.json
          git commit -m "Update Research Monitor data"
          git push origin HEAD:main
