name: Daily IPO Tracker

permissions:
  contents: write

concurrency:
  group: research-monitor-feed-writers
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    # 12:00 UTC = ~7-8am US Eastern depending on DST. Adjust as needed.
    - cron: '0 12 * * 1-5'
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: DEBUG - list repo contents
        run: ls -la

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Run daily pipeline
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python main.py

      - name: Publish Research Monitor data
        run: |
          if git diff --quiet -- docs/data/filings.json docs/data/filings.csv; then
            echo "Research Monitor data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/filings.json docs/data/filings.csv
          git commit -m "Update Research Monitor data"
          git pull --rebase origin main
          git push origin HEAD:main
