      - name: Run Research Monitor test suite
        run: |
          python -m unittest discover -s src -p 'test_*.py' -v

      - name: Verify ownership refresh mutex before repository commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          active = []
          for status in ('in_progress', 'queued', 'pending'):
              raw = subprocess.check_output([
                  'gh', 'api', f'repos/{repo}/actions/runs?branch=main&status={status}&per_page=100'
              ], text=True)
              for run in json.loads(raw).get('workflow_runs', []):
                  if run.get('name') == 'Refresh Prospect Ownership History':
                      active.append((status, run.get('id')))
          if active:
              raise SystemExit(f'Ownership refresh mutex active; refusing commit: {active}')
          print('Ownership refresh mutex clear.')
          PY

      - name: Publish lifecycle update atomically
        run: |
          rm .github/workflows/ipo-lifecycle-once.yml
          git diff --check
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during lifecycle update; refusing stale commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html src/dashboard_export.py src/test_dashboard_export.py src/test_dashboard_ui.py .github/workflows/ipo-lifecycle-once.yml
          git commit -m "Track IPO filing and pricing lifecycle"
          git push origin HEAD:main
