name: Apply IPO lifecycle UI update once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ipo-lifecycle-once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: research-monitor-feed-writers
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply lifecycle patch from previous workflow revision
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/ipo-lifecycle-once.yml'],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          start = old.index(start_marker) + len(start_marker)
          end = old.index("\n          PY", start)
          block = old[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          patch = '\n'.join(lines) + '\n'
          Path('/tmp/apply_lifecycle.py').write_text(patch, encoding='utf-8')
          subprocess.check_call(['python', '/tmp/apply_lifecycle.py'])
          PY

      - name: Run Research Monitor test suite
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Verify ownership refresh mutex before repository commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          active = []
          for status in ('in_progress', 'queued', 'pending'):
              raw = subprocess.check_output([
                  'gh', 'api', f'repos/{repo}/actions/runs?branch=main&status={status}&per_page=100'
              ], text=True)
              for run in json.loads(raw).get('workflow_runs', []):
                  if run.get('name') == 'Refresh Prospect Ownership History':
                      active.append((status, run.get('id')))
          if active:
              raise SystemExit(f'Ownership refresh mutex active; refusing commit: {active}')
          print('Ownership refresh mutex clear.')
          PY

      - name: Publish lifecycle update atomically
        run: |
          rm .github/workflows/ipo-lifecycle-once.yml
          git diff --check
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during lifecycle update; refusing stale commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html src/dashboard_export.py src/test_dashboard_export.py src/test_dashboard_ui.py .github/workflows/ipo-lifecycle-once.yml
          git commit -m "Track IPO filing and pricing lifecycle"
          git push origin HEAD:main
