              'function render(){filings.forEach(f=>f.status=statusFor(f));const visible=visibleFilings();rows.replaceChildren();for(const filing of visible){const row=document.createElement("tr");row.dataset.id=filing.id;const company=document.createElement("div"),line=document.createElement("div");line.className="company-line";line.append(text("div",hasStanfordBeneficialOwner(filing)?"company stanford-company":"company",filing.company));company.append(line,text("div","sub",filing.cik?`CIK ${filing.cik}`:""));appendCell(row,company);appendCell(row,text("span","",filing.ticker||"—"));appendCell(row,text("span","",filing.form));appendCell(row,text("span","",filing.stage));appendCell(row,text("span","",dateLabel(filingDateValue(filing))));appendCell(row,text("span","",dateLabel(pricingDateValue(filing))));appendCell(row,text("span","quote",money(filing.ipo_size||filing.value)));appendCell(row,text("span","quote",filingPrice(filing.price_range||filing.filing_price)));appendCell(row,text("span","quote",quotePrice(filing.offering_price)));appendCell(row,text("span","quote",quotePrice(filing.current_price)));rows.append(row)}applyColumnOrder();$("resultCount").textContent=`${visible.length} of ${filings.length} filings`;$("savedCount").textContent=filings.filter(isSaved).length;renderMonthlyActivity();renderRecentActivity();const empty=$("empty");empty.classList.toggle("hidden",visible.length>0);if(!visible.length)empty.textContent=loadError?"Live feed unavailable":filings.length?"No matching filings":"No qualifying domestic IPO filings"}\n',
          )
          replace_once(
