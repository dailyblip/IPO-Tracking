name: Launch January 2026 Research Monitor Backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/january-2026-backfill-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Replay January with the current hardened historical writer. The historical
      # publication policy keeps the pre-June $100M threshold intact. Relaunch
      # after authoritative whole-share offering rounding repair in PR #297.
      - name: Dispatch validated January 2026 historical backfill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh workflow run backfill.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f start_date=2026-01-01
          -f end_date=2026-01-31
