name: Refresh Prospect Ownership History

on:
  push:
    branches: [main]
    paths:
      - 'src/ownership_parser.py'
      - 'src/filing_parser.py'
      - 'src/main.py'
      - 'src/dashboard_export.py'
      - 'src/prospect_research.py'
      - 'src/stanford_grader.py'
      - 'src/stanford_sec_backfill.py'
      - 'src/filing_price_history.py'
      - 'src/lifecycle_reconciler.py'
      - 'src/lifecycle_date_sanitizer.py'
      - 'src/followon_sanitizer.py'
      - 'src/prepricing_quote_sanitizer.py'
      - 'src/market_quote_identity.py'
      - 'src/location_quality.py'
      - 'src/test_stanford_grader.py'
      - 'src/test_stanford_management_scope.py'
      - 'src/test_stanford_sec_backfill.py'
      - 'src/test_filing_price_history.py'
      - 'src/test_lifecycle_reconciler.py'
      - 'src/test_lifecycle_date_sanitizer.py'
      - 'src/test_followon_sanitizer.py'
      - 'src/test_prepricing_quote_sanitizer.py'
      - 'src/test_market_quote_identity.py'
      - 'src/test_location_quality.py'
      - 'src/test_dashboard_ui.py'
      - 'src/company_name_normalizer.py'
      - 'src/public_feed_policy.py'
      - 'src/test_public_feed_policy.py'
      - 'src/test_workflow_contract.py'
      - '.github/workflows/ownership-refresh.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: research-monitor-feed-writers
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      # Full June-present replay also refreshes lifecycle filing/pricing dates after export schema changes.
      - name: Refresh qualifying IPO history and Stanford affiliations
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          START=2026-06-01
          END=$(date -u +%F)
          echo "Regrading ownership and Stanford affiliations from $START through $END"
          python main.py --backfill-start "$START" --backfill-end "$END"
      - name: Reconcile final 424B4 lifecycle transitions
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python lifecycle_reconciler.py ../docs/data/filings.json
      - name: Sanitize impossible lifecycle dates
        working-directory: src
        run: python lifecycle_date_sanitizer.py ../docs/data/filings.json
      - name: Remove post-reporting follow-on/resale offerings
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python followon_sanitizer.py ../docs/data/filings.json
      - name: Recover SEC-confirmed Stanford beneficial-owner affiliations
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: |
          python stanford_sec_backfill.py ../docs/data/filings.json \
            --start 2026-06-01 --end "$(date -u +%F)"
      - name: Normalize issuer display names
        working-directory: src
        run: python company_name_normalizer.py ../docs/data/filings.json
      - name: Start activity chart at June 2026
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'start=new Date(Date.UTC(2026,7,1))'
          new = 'start=new Date(Date.UTC(2026,5,1))'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Monthly activity start marker not found')
          PY
      - name: Enforce public-feed eligibility policy
        working-directory: src
        run: python public_feed_policy.py ../docs/data/filings.json
      - name: Repair malformed issuer locations
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python location_quality.py ../docs/data/filings.json
      - name: Recover authoritative preliminary filing-price ranges
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python filing_price_history.py ../docs/data/filings.json
      - name: Remove market quotes from pre-pricing records
        working-directory: src
        run: python prepricing_quote_sanitizer.py ../docs/data/filings.json
      - name: Verify market quote issuer identity
        working-directory: src
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: python market_quote_identity.py ../docs/data/filings.json
      - name: Validate public feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('docs/data/filings.json').read_text())
          assert isinstance(feed.get('filings'), list)
          stanford_people=[]
          for filing in feed['filings']:
              assert isinstance(filing.get('people', []), list)
              stage=str(filing.get('stage') or '').strip().lower()
              if stage in {'pre-pricing', 'prepricing', 'filed'} and filing.get('current_price') not in (None, ''):
                  raise SystemExit(
                      f"Pre-pricing record has a live market quote: {filing.get('company')} "
                      f"({filing.get('ticker')})"
                  )
              filing_date=filing.get('filing_date')
              pricing_date=filing.get('pricing_date')
              if filing_date and pricing_date and str(filing_date) > str(pricing_date):
                  raise SystemExit(
                      f"Impossible lifecycle chronology: {filing.get('company')} "
                      f"filed {filing_date} after pricing {pricing_date}"
                  )
              for person in filing.get('people', []):
                  assert isinstance(person.get('stanford_university_bio', False), bool)
                  if person.get('stanford_university_bio'):
                      stanford_people.append((filing.get('company'), person.get('name')))
          if not stanford_people:
              raise SystemExit('Historical refresh produced zero confirmed Stanford beneficial owners')
          html = Path('docs/index.html').read_text(encoding='utf-8')
          assert 'start=new Date(Date.UTC(2026,5,1))' in html
          print(f"Validated {len(feed['filings'])} filings; Stanford matches: {stanford_people}")
          PY
      - name: Publish refreshed ownership data
        run: |
          if [ -z "$(git status --short -- docs/data/filings.json docs/data/filings.csv docs/index.html)" ]; then
            echo "Ownership and dashboard data unchanged."
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; skipping stale ownership publication."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/filings.json docs/data/filings.csv docs/index.html
          git commit -m "Refresh Prospect Research ownership history"
          git push origin HEAD:main
