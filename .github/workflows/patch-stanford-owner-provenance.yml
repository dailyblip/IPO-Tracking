name: Patch Stanford Owner Provenance

on:
  push:
    branches:
      - fix/stanford-beneficial-owner-provenance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stanford-beneficial-owner-provenance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded provenance repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/main.py',
              '                "Holder Name": holder_name,\n                "Role": _role_from_bio(person_bio_text),',
              '                "Holder Name": holder_name,\n                "Beneficial Owner": bool(holder_name),\n                "Role": _role_from_bio(person_bio_text),',
          )
          replace_once(
              'src/main.py',
              '                "Holder Name": person_name,\n                "Role": _role_from_bio(person_bio_text),',
              '                "Holder Name": person_name,\n                "Beneficial Owner": False,\n                "Role": _role_from_bio(person_bio_text),',
          )
          replace_once(
              'src/prospect_research.py',
              '        "holder_type": holder_type(name),\n        "role": first_present(row, "Role", "Title", "Position", "Relationship"),',
              '        "holder_type": holder_type(name),\n        "is_beneficial_owner": confirmed_boolean(first_present(row, "Beneficial Owner")),\n        "role": first_present(row, "Role", "Title", "Position", "Relationship"),',
          )
          replace_once(
              'src/dashboard_export.py',
              '    "name", "shares", "cash_value", "stanford_university_bio", "ipo_value",',
              '    "name", "is_beneficial_owner", "shares", "cash_value", "stanford_university_bio", "ipo_value",',
          )
          replace_once(
              'src/dashboard_export.py',
              '    "stanford_university_bio", "holder_type", "role", "ownership_percent", "ownership_percent_before", "ownership_percent_after",',
              '    "stanford_university_bio", "is_beneficial_owner", "holder_type", "role", "ownership_percent", "ownership_percent_before", "ownership_percent_after",',
          )
          replace_once(
              'src/dashboard_export.py',
              '                "stanford_university_bio": person.get("stanford_university_bio", False),\n                "holder_type": person.get("holder_type"), "role": person.get("role"),',
              '                "stanford_university_bio": person.get("stanford_university_bio", False),\n                "is_beneficial_owner": person.get("is_beneficial_owner", False),\n                "holder_type": person.get("holder_type"), "role": person.get("role"),',
          )
          replace_once(
              'schemas/filings-v1.schema.json',
              '        "stanford_university_bio": {"type": "boolean"},\n        "ipo_value": {"type": ["number", "null"]},',
              '        "stanford_university_bio": {"type": "boolean"},\n        "is_beneficial_owner": {"type": "boolean"},\n        "ipo_value": {"type": ["number", "null"]},',
          )
          replace_once(
              'docs/index.html',
              'function isStanfordBeneficialOwner(person){const shares=Number(person.shares);return person.stanford_university_bio===true&&Number.isFinite(shares)&&shares>0}',
              'function isStanfordBeneficialOwner(person){return person.stanford_university_bio===true&&person.is_beneficial_owner===true}',
          )
          replace_once(
              'src/test_dashboard_ui.py',
              '            "function isStanfordBeneficialOwner(person){const shares=Number(person.shares);return person.stanford_university_bio===true&&Number.isFinite(shares)&&shares>0}",',
              '            "function isStanfordBeneficialOwner(person){return person.stanford_university_bio===true&&person.is_beneficial_owner===true}",',
          )

          Path('src/test_beneficial_owner_provenance.py').write_text(r'''import unittest
          from pathlib import Path

          import dashboard_export
          from prospect_research import prospect_person_metadata
          from feed_schema_contract import load_schema


          ROOT = Path(__file__).resolve().parents[1]


          class BeneficialOwnerProvenanceTests(unittest.TestCase):
              def _row(self, beneficial_owner):
                  return {
                      "_accession_no": "0001234567-26-000001",
                      "_cik": "1234567",
                      "_form": "424B4",
                      "_sec_url": "https://www.sec.gov/Archives/edgar/data/1234567/000123456726000001/0001234567-26-000001-index.htm",
                      "Company Name": "Owner Provenance Co.",
                      "Ticker": "OWNR",
                      "Date of Filing": "2026-08-01",
                      "Date of Pricing": "2026-08-05",
                      "Actual Price": 10.0,
                      "Amount Raised": 10000000.0,
                      "Offering Size Source": "authoritative final 424B4 terms",
                      "Offering Size Confidence": "High",
                      "Holder Name": "Confirmed Stanford Person",
                      "Beneficial Owner": beneficial_owner,
                      "Shares": None,
                      "Shares After IPO": None,
                      "Stanford Grade": 5,
                      "Stanford Affiliation Confirmed": True,
                      "Stanford University in Bio": True,
                      "Stanford Justification": "SEC filing confirms the Stanford affiliation.",
                  }

              def test_metadata_preserves_owner_provenance_independently_of_share_count(self):
                  metadata = prospect_person_metadata(self._row(True), "Confirmed Stanford Person")
                  self.assertTrue(metadata["is_beneficial_owner"])
                  self.assertTrue(metadata["stanford_university_bio"])

              def test_management_only_person_is_not_promoted_to_beneficial_owner(self):
                  metadata = prospect_person_metadata(self._row(False), "Confirmed Stanford Person")
                  self.assertFalse(metadata["is_beneficial_owner"])
                  self.assertTrue(metadata["stanford_university_bio"])

              def test_public_payload_keeps_owner_flag_when_shares_are_unavailable(self):
                  payload = dashboard_export.build_payload(
                      [self._row(True)], generated_at="2026-09-03T00:00:00+00:00"
                  )
                  person = payload["filings"][0]["people"][0]
                  self.assertTrue(person["is_beneficial_owner"])
                  self.assertIsNone(person["shares"])

              def test_pipeline_marks_parsed_holders_and_management_separately(self):
                  source = (ROOT / "src" / "main.py").read_text(encoding="utf-8")
                  self.assertIn('"Beneficial Owner": bool(holder_name)', source)
                  self.assertIn('"Beneficial Owner": False', source)

              def test_dashboard_uses_owner_provenance_not_share_quantity_for_stanford_red(self):
                  html = (ROOT / "docs" / "index.html").read_text(encoding="utf-8")
                  self.assertIn(
                      'function isStanfordBeneficialOwner(person){return person.stanford_university_bio===true&&person.is_beneficial_owner===true}',
                      html,
                  )
                  self.assertNotIn(
                      'person.stanford_university_bio===true&&Number.isFinite(shares)&&shares>0',
                      html,
                  )

              def test_v1_schema_and_allowlist_carry_owner_provenance(self):
                  schema = load_schema(dashboard_export.SCHEMA_VERSION)
                  self.assertIn("is_beneficial_owner", dashboard_export.PUBLIC_PERSON_FIELDS)
                  self.assertIn("is_beneficial_owner", schema["$defs"]["person"]["properties"])


          if __name__ == "__main__":
              unittest.main()
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')
          PY

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run Research Monitor tests
        env:
          SKIP_LIVE_GOLDEN: '1'
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Check ownership-history commit guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            count=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
              | jq '[.workflow_runs[] | select(.name == "Refresh Prospect Ownership History")] | length')
            if [ "$count" -gt 0 ]; then
              echo "Refresh Prospect Ownership History is ${status}; refusing commit."
              exit 1
            fi
          done

      - name: Commit bounded repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-stanford-owner-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.py src/prospect_research.py src/dashboard_export.py schemas/filings-v1.schema.json docs/index.html src/test_dashboard_ui.py src/test_beneficial_owner_provenance.py .github/workflows/patch-stanford-owner-provenance.yml
          git commit -m "Preserve Stanford beneficial-owner provenance"
          git push origin HEAD:fix/stanford-beneficial-owner-provenance
