name: Apply PR35 Research Monitor reorg

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/reorg-research-monitor-columns'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reorg-research-monitor-columns
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reorganize Research Monitor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text(encoding='utf-8')
          if '.stanford-company{' not in s:
              s=s.replace('.company{font-weight:700}', '.company{font-weight:700}.stanford-company{color:var(--cardinal);font-weight:800}')
          s=s.replace('<div><select class="control" id="priorityFilter"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div>','')
          s=s.replace('<option value="priority">Priority</option>','')
          old='<th>Company</th><th>Form</th><th>Stage</th><th>Filed</th><th>IPO size</th><th>Offering value</th><th>Filing price</th><th>Final IPO price</th><th>Current price</th><th>Priority</th><th>Public signals</th><th>Status</th>'
          new='<th>Company Name</th><th>Ticker</th><th>Form</th><th>Stage</th><th>Filed</th><th>IPO Size / Offering Value</th><th>Filing Price</th><th>Final IPO Price</th><th>Current Price</th><th>Public Signals</th><th>Status</th>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('expected table header not found')
          s=s.replace('function priorityRank(v){return {High:3,Medium:2,Low:1}[v]||0}\n','')
          old_filters='const q=$("search").value.trim().toLowerCase(),form=$("formFilter").value,priority=$("priorityFilter").value,status=$("statusFilter").value,days=$("dateFilter").value,sort=$("sortBy").value;'
          new_filters='const q=$("search").value.trim().toLowerCase(),form=$("formFilter").value,status=$("statusFilter").value,days=$("dateFilter").value,sort=$("sortBy").value;'
          if old_filters in s:
              s=s.replace(old_filters,new_filters,1)
          s=s.replace('&&(!priority||f.priority===priority)','')
          s=s.replace('if(sort==="priority")return priorityRank(b.priority)-priorityRank(a.priority);','')
          old_row='const company=document.createElement("div");company.append(text("div","company",filing.company),text("div","sub",`${filing.ticker||"No ticker"}${filing.cik?` · CIK ${filing.cik}`:""}`));appendCell(row,company);appendCell(row,text("span","",filing.form));appendCell(row,text("span","",filing.stage));appendCell(row,text("span","",dateLabel(filing.filed)));appendCell(row,text("span","quote",money(filing.ipo_size)));appendCell(row,text("span","quote",money(filing.value)));appendCell(row,text("span","quote",filingPrice(filing.price_range||filing.filing_price)));appendCell(row,text("span","quote",quotePrice(filing.offering_price)));appendCell(row,text("span","quote",quotePrice(filing.current_price)));appendCell(row,text("span","",filing.priority));'
          new_row='const company=document.createElement("div");const stanfordOwner=filing.people.some(p=>p.stanford_university_bio===true);company.append(text("div",stanfordOwner?"company stanford-company":"company",filing.company),text("div","sub",filing.cik?`CIK ${filing.cik}`:""));appendCell(row,company);appendCell(row,text("span","",filing.ticker||"—"));appendCell(row,text("span","",filing.form));appendCell(row,text("span","",filing.stage));appendCell(row,text("span","",dateLabel(filing.filed)));appendCell(row,text("span","quote",money(filing.ipo_size||filing.value)));appendCell(row,text("span","quote",filingPrice(filing.price_range||filing.filing_price)));appendCell(row,text("span","quote",quotePrice(filing.offering_price)));appendCell(row,text("span","quote",quotePrice(filing.current_price)));'
          if old_row in s:
              s=s.replace(old_row,new_row,1)
          elif new_row not in s:
              raise SystemExit('expected table row renderer not found')
          s=s.replace('$("priorityFilter").value="";','')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes needed"
          else
            git commit -m "Reorganize Research Monitor columns and Stanford highlighting"
            git push origin HEAD:feature/reorg-research-monitor-columns
          fi
