name: S-1 Pre-Pricing Monitor

permissions:
  contents: write

concurrency:
  group: research-monitor-feed-writers
  cancel-in-progress: false
  queue: max

on:
  pull_request:
    paths:
      - 'src/s1_monitor.py'
      - 'src/test_s1_monitor.py'
      - 'src/edgar_client.py'
      - 'src/test_resale_registration_exclusion.py'
      - 'src/test_fullpac_real_proceeds_regression.py'
      - 'src/s1_registration_history_gate.py'
      - 'src/test_s1_registration_history_gate.py'
      - 'src/resale_registration_sanitizer.py'
      - 'src/test_resale_registration_sanitizer.py'
      - 'src/filing_parser.py'
      - 'src/test_cover_price_context.py'
      - 'src/filing_price_history.py'
      - 'src/test_filing_price_history.py'
      - 'src/public_feed_policy.py'
      - 'src/test_public_feed_policy.py'
      - 'src/company_name_normalizer.py'
      - 'src/test_company_name_normalizer.py'
      - 'src/lifecycle_date_sanitizer.py'
      - 'src/test_lifecycle_date_sanitizer.py'
      - 'src/feed_schema_contract.py'
      - 'src/test_feed_schema_contract.py'
      - 'src/test_s1_stale_publication_guard.py'
      - 'schemas/**'
      - 'requirements.txt'
      - '.github/workflows/s1-watch.yml'
  # Source changes already trigger Daily IPO Tracker, which writes the same public
  # feed under the same concurrency group. Running S-1 on the same push can leave
  # it pending and then cancelled when another feed writer queues. Serialize the
  # S-1 rebuild behind a successful Daily run instead. Keep a direct push trigger
  # only for changes to this workflow itself so orchestration fixes self-validate.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/s1-watch.yml'
  workflow_run:
    workflows:
      - Daily IPO Tracker
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run S-1 monitor tests
        working-directory: src
        run: python -m unittest test_s1_monitor.py test_resale_registration_exclusion.py test_fullpac_real_proceeds_regression.py test_s1_registration_history_gate.py test_resale_registration_sanitizer.py test_cover_price_context.py test_filing_price_history.py test_public_feed_policy.py test_company_name_normalizer.py test_lifecycle_date_sanitizer.py test_feed_schema_contract.py test_s1_stale_publication_guard.py -v

  update-feed:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update pre-pricing S-1 feed
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python s1_monitor.py 14
      - name: Exclude resale-only S-1 amendments by registration history
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python s1_registration_history_gate.py ../docs/data/s1_watch.json ../docs/data/filings.json
      - name: Exclude resale-only S-1 registrations at release
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python resale_registration_sanitizer.py ../docs/data/s1_watch.json ../docs/data/filings.json
      - name: Sanitize impossible lifecycle dates
        working-directory: src
        run: python lifecycle_date_sanitizer.py ../docs/data/filings.json
      - name: Enforce public-feed eligibility policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json
      - name: Recover authoritative preliminary filing-price ranges
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python filing_price_history.py ../docs/data/filings.json
      - name: Normalize issuer display names
        working-directory: src
        run: python company_name_normalizer.py ../docs/data/filings.json
      - name: Block weak offering-size provenance before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('docs/data/filings.json').read_text(encoding='utf-8'))
          failures = []
          for filing in payload.get('filings', []):
              # Unknown offering size is explicitly allowed for an otherwise
              # qualifying operating-company IPO. Only validate provenance when
              # a numeric offering value is actually being published.
              raw_value = filing.get('value')
              if raw_value in (None, ''):
                  continue
              label = filing.get('company') or filing.get('id') or '<unknown>'
              source = str(filing.get('offering_size_source') or '').strip()
              confidence = str(filing.get('offering_size_confidence') or '').strip()
              if not source:
                  failures.append(f'{label}: populated offering size is missing source provenance')
              if confidence.casefold() != 'high':
                  failures.append(f'{label}: populated offering-size confidence must be High, got {confidence!r}')
          if failures:
              raise SystemExit('Refusing to publish S-1 feed with weak offering-size evidence:\n- ' + '\n- '.join(failures))
          print(f"Validated populated offering-size provenance for {len(payload.get('filings', []))} filing(s)")
          PY
      - name: Validate V1 public feed schema
        run: python src/feed_schema_contract.py docs/data/filings.json
      - name: Publish S-1 watch and researcher queue data
        run: |
          if git diff --quiet -- docs/data/s1_watch.json docs/data/filings.json docs/data/filings.csv; then
            echo "S-1 watch and researcher queue data are unchanged."
            exit 0
          fi

          # Generated feed files are not safe to rebase over a newer main. If main
          # advanced while this serialized writer was processing, discard the stale
          # candidate and let the next Daily/S-1 cycle regenerate from the new head.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; skipping stale S-1 publication."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/s1_watch.json docs/data/filings.json docs/data/filings.csv
          git commit -m "Update S-1 pre-pricing watch data"
          git push origin HEAD:main
