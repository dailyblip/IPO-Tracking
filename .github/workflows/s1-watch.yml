name: S-1 Pre-Pricing Monitor

permissions:
  contents: write

concurrency:
  group: research-monitor-feed-writers
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - 'src/s1_monitor.py'
      - 'src/test_s1_monitor.py'
      - 'src/public_feed_policy.py'
      - 'src/test_public_feed_policy.py'
      - '.github/workflows/s1-watch.yml'
  push:
    branches:
      - main
    paths:
      - 'src/s1_monitor.py'
      - 'src/test_s1_monitor.py'
      - 'src/public_feed_policy.py'
      - 'src/test_public_feed_policy.py'
      - '.github/workflows/s1-watch.yml'
  schedule:
    # Run shortly after the primary IPO tracker on weekdays.
    - cron: '20 12 * * 1-5'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run S-1 monitor tests
        working-directory: src
        run: python -m unittest test_s1_monitor.py test_public_feed_policy.py -v

  update-feed:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update pre-pricing S-1 feed
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: |
          # Re-scan a two-week window on every run so transient SEC/index failures
          # cannot become permanent gaps after a short scheduled lookback expires.
          python s1_monitor.py 14

      - name: Enforce public-feed eligibility policy
        working-directory: src
        run: python public_feed_policy.py ../docs/data/filings.json

      - name: Publish S-1 watch and researcher queue data
        run: |
          if git diff --quiet -- docs/data/s1_watch.json docs/data/filings.json docs/data/filings.csv; then
            echo "S-1 watch and researcher queue data are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/s1_watch.json docs/data/filings.json docs/data/filings.csv
          git commit -m "Update S-1 pre-pricing watch data"

          # Preserve a successful discovery even if another automation advanced main
          # while this run was executing. Rebase onto the latest main and publish;
          # any real data conflict now fails visibly instead of being discarded as success.
          git pull --rebase origin main
          git push origin HEAD:main
