name: Stanford Historical Backfill (One-Time)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stanford-backfill-once.yml'

permissions:
  contents: write

concurrency:
  group: research-monitor-feed-writers
  cancel-in-progress: false
  queue: max

jobs:
  stanford-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      BACKFILL_START: '2026-06-01'

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # This replay can sit behind another public-feed writer. Start from the
          # latest committed feed after that queue drains, not the older push SHA.
          # The publish-time stale guard below still fails closed if main advances
          # again while this replay is running.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The checked-in feed can lag a newly merged release-policy repair. Normalize
      # it before tests so the one-time replay never starts from a state current
      # code would refuse to publish.
      - name: Reconcile checked-in feed with current release policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json

      - name: Run unit tests
        env:
          SKIP_LIVE_GOLDEN: '1'
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Resolve backfill end date
        run: echo "BACKFILL_END=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Refresh current pre-pricing S-1 queue
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python s1_monitor.py 4

      - name: Run Stanford historical backfill
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STANFORD_RESEARCH_CACHE_PATH: ../docs/data/stanford_research_cache.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: >
          python main.py
          --backfill-start "$BACKFILL_START"
          --backfill-end "$BACKFILL_END"

      # This workflow writes the same public feed as Daily/Backfill/Ownership, so it
      # must pass the same release-safety chain before publication. The steps below
      # repair authoritative fields where possible and fail closed on unsupported
      # secondary data; they do not expand the June-present Stanford replay window.
      - name: Clear market quotes not refreshed in this run
        working-directory: src
        run: python market_price_freshness_gate.py ../docs/data/filings.json

      - name: Reconcile final 424B4 lifecycle transitions
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python lifecycle_reconciler.py ../docs/data/filings.json

      - name: Reconcile authoritative IPO pricing dates
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python pricing_date_reconciler.py ../docs/data/filings.json

      - name: Sanitize impossible lifecycle dates
        working-directory: src
        run: python lifecycle_date_sanitizer.py ../docs/data/filings.json

      - name: Remove unresolved final pricing states
        working-directory: src
        run: python final_pricing_release_gate.py ../docs/data/filings.json

      - name: Remove post-reporting follow-on/resale offerings
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python followon_sanitizer.py ../docs/data/filings.json

      - name: Recover SEC-confirmed Stanford beneficial-owner affiliations
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: >
          python stanford_sec_backfill.py ../docs/data/filings.json
          --start "$BACKFILL_START" --end "$BACKFILL_END"

      - name: Normalize issuer display names
        working-directory: src
        run: python company_name_normalizer.py ../docs/data/filings.json

      - name: Enforce public-feed eligibility policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json

      - name: Preserve authoritative final offering aggregates
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python offering_value_reconciler.py ../docs/data/filings.json

      - name: Repair malformed issuer locations
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python location_quality.py ../docs/data/filings.json

      - name: Recover authoritative preliminary filing-price ranges
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python filing_price_history.py ../docs/data/filings.json

      - name: Remove market quotes from pre-pricing records
        working-directory: src
        run: python prepricing_quote_sanitizer.py ../docs/data/filings.json

      - name: Verify market quote issuer identity
        working-directory: src
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python market_quote_release_gate.py ../docs/data/filings.json

      - name: Run release-blocking regression suite on generated feed
        env:
          SKIP_LIVE_GOLDEN: '1'
        run: python -m unittest discover -s src -p 'test_*.py' -v

      - name: Validate generated lifecycle uniqueness
        run: python -m unittest discover -s src -p 'test_issuer_row_consistency.py' -v

      - name: Validate V1 public feed schema
        run: python src/feed_schema_contract.py docs/data/filings.json

      - name: Validate refreshed golden records
        run: python -m unittest discover -s src -p 'test_golden_records.py' -v

      - name: Refresh stateful research alerts
        run: python src/research_alerts.py

      - name: Validate Stanford output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          feed = json.loads(Path('docs/data/filings.json').read_text())
          rows = feed.get('filings', [])
          if not isinstance(rows, list):
              raise SystemExit('docs/data/filings.json must contain a filings list')

          stanford_people = []
          for filing in rows:
              stage = str(filing.get('stage') or '').strip().lower()
              if stage in {'pre-pricing', 'prepricing', 'filed'} and filing.get('current_price') not in (None, ''):
                  raise SystemExit(
                      f"Pre-pricing record has a live market quote: {filing.get('company')} "
                      f"({filing.get('ticker')})"
                  )
              filing_date = filing.get('filing_date')
              pricing_date = filing.get('pricing_date')
              if filing_date and pricing_date and str(filing_date) > str(pricing_date):
                  raise SystemExit(
                      f"Impossible lifecycle chronology: {filing.get('company')} "
                      f"filed {filing_date} after pricing {pricing_date}"
                  )
              for person in filing.get('people') or []:
                  bio = person.get('stanford_university_bio')
                  if bio:
                      stanford_people.append((filing.get('company'), person.get('name'), bio))

          print(f'Validated {len(rows)} filings; Stanford-affiliated people found: {len(stanford_people)}')
          if not stanford_people:
              raise SystemExit('Backfill produced zero Stanford-affiliated people; refusing to publish')
          PY

      - name: Publish Research Monitor data
        run: |
          if [ -z "$(git status --short -- docs/data/s1_watch.json docs/data/filings.json docs/data/filings.csv docs/data/stanford_research_cache.json docs/data/alerts.json docs/data/alerts_state.json)" ]; then
            echo "Research Monitor data is unchanged."
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run; refusing stale Stanford backfill publication."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/s1_watch.json docs/data/filings.json docs/data/filings.csv docs/data/stanford_research_cache.json docs/data/alerts.json docs/data/alerts_state.json
          git commit -m "Backfill Stanford affiliations through $BACKFILL_END"
          git push origin HEAD:main
