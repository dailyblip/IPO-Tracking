name: Test Research Monitor

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'docs/index.html'
      - 'docs/data/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-monitor-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Policy changes can make a previously checked-in public row newly
      # ineligible before a feed-writer has had a chance to persist the repair.
      # Normalize the runner's local snapshot first so CI tests the current
      # release policy without publishing or committing generated data.
      - name: Reconcile checked-in feed with current release policy
        working-directory: src
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python public_feed_policy.py ../docs/data/filings.json

      - name: Run unit tests
        run: python -m unittest discover -s src -p 'test_*.py' -v
      - name: Validate V1 public feed schema
        run: python src/feed_schema_contract.py docs/data/filings.json
      - name: Validate dashboard assets and public release policy
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import date, datetime
          from html.parser import HTMLParser
          from pathlib import Path

          HTMLParser().feed(Path('docs/index.html').read_text(encoding='utf-8'))
          payload = json.loads(Path('docs/data/filings.json').read_text(encoding='utf-8'))
          assert payload['schema_version'] == 1
          filings = payload['filings']
          assert isinstance(filings, list)

          sys.path.insert(0, str(Path('src').resolve()))
          from company_name_normalizer import normalize_company_name
          from public_feed_policy import (
              _has_valid_filing_date,
              _normalize_market_value_consistency,
              _normalize_people_types,
              qualifies_for_public_feed,
          )

          failures = []
          normalization_drift = []
          for filing in filings:
              label = filing.get('company') or filing.get('id') or '<unknown>'
              company = str(filing.get('company') or '').strip()
              if not company:
                  failures.append(f'{label}: missing company name')
              elif normalize_company_name(company) != company:
                  failures.append(f'{label}: issuer display name is not normalized')

              if not _has_valid_filing_date(filing):
                  failures.append(f'{label}: invalid/future filing date')
              if not qualifies_for_public_feed(filing):
                  failures.append(f'{label}: violates public-feed qualification policy')

              raw_value = filing.get('value')
              value = None
              if raw_value not in (None, '', '—'):
                  try:
                      value = float(str(raw_value).replace(',', '').replace('$', '').strip())
                  except (TypeError, ValueError):
                      failures.append(f'{label}: populated offering value is invalid: {raw_value!r}')
                  else:
                      if value <= 0:
                          failures.append(f'{label}: populated offering value must be positive')

              if value is not None:
                  size_source = str(filing.get('offering_size_source') or '').strip()
                  size_confidence = str(filing.get('offering_size_confidence') or '').strip()
                  if not size_source:
                      failures.append(f'{label}: populated offering value lacks source provenance')
                  if not size_confidence:
                      failures.append(f'{label}: populated offering value lacks confidence metadata')
                  elif size_confidence.casefold() != 'high':
                      failures.append(
                          f'{label}: populated offering value confidence must be High, got {size_confidence!r}'
                      )

              filing_date = str(filing.get('filing_date') or '').strip()
              pricing_date = str(filing.get('pricing_date') or '').strip()
              if filing_date and pricing_date:
                  try:
                      if date.fromisoformat(pricing_date) < date.fromisoformat(filing_date):
                          failures.append(f'{label}: pricing date precedes initial filing date')
                  except ValueError:
                      failures.append(f'{label}: invalid filing/pricing date format')

              if str(filing.get('stage') or '').strip().casefold() == 'priced':
                  try:
                      offering_price = float(filing.get('offering_price'))
                  except (TypeError, ValueError):
                      offering_price = None
                  if offering_price is None or offering_price <= 0:
                      failures.append(f'{label}: priced IPO lacks a valid final IPO price')
                  if not pricing_date:
                      failures.append(f'{label}: priced IPO lacks pricing date')

              current_price = filing.get('current_price')
              if current_price not in (None, ''):
                  try:
                      current_price_number = float(current_price)
                  except (TypeError, ValueError):
                      current_price_number = None
                  if current_price_number is None or current_price_number <= 0:
                      failures.append(f'{label}: current price is invalid')
                  price_updated = str(filing.get('price_updated') or '').strip()
                  if not price_updated:
                      failures.append(f'{label}: current price lacks update timestamp')
                  else:
                      try:
                          datetime.fromisoformat(price_updated.replace('Z', '+00:00'))
                      except ValueError:
                          failures.append(f'{label}: current-price timestamp is invalid')

              normalized = _normalize_market_value_consistency(_normalize_people_types(filing))
              if normalized != filing:
                  normalization_drift.append(label)

          if failures:
              raise SystemExit('Public feed release-policy failure:\n- ' + '\n- '.join(failures))
          if normalization_drift:
              raise SystemExit(
                  'Public feed contains stale deterministic normalization for: '
                  + ', '.join(normalization_drift)
              )

          print(f'Dashboard assets and {len(filings)} qualifying public filings are valid')
          PY
