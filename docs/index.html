<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPO Ledger</title>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F7F5F1;
    --surface-raised: #FFFFFF;
    --border: #DDD9D2;
    --text: #2E2D29;
    --text-dim: #53565A;
    --text-faint: #8A8D91;
    --cardinal: #8C1515;
    --cardinal-dark: #7A0000;
    --paloverde: #279989;
    --digital-red: #B1040E;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  :root[data-theme="dark"] {
    --bg: #171613;
    --surface: #211F1B;
    --surface-raised: #2A2823;
    --border: #3A3830;
    --text: #F2F0EA;
    --text-dim: #B7B4AC;
    --text-faint: #7D7A72;
    --cardinal: #C23B3B;
    --cardinal-dark: #E85454;
    --paloverde: #3FBBA8;
    --digital-red: #E5534B;
  }

  body { transition: background-color 0.15s ease, color 0.15s ease; }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--sans);
    margin-right: 8px;
  }
  .theme-toggle:hover { border-color: var(--cardinal-dark); color: var(--cardinal); }
  .theme-toggle:focus-visible { outline: 2px solid var(--cardinal); outline-offset: 2px; }

  body { border-top: 6px solid var(--cardinal); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ---------- Header / ticker strip ---------- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .masthead h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0.3px;
    margin: 0;
    color: var(--text);
  }

  .masthead .sub {
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 8px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
    font-family: var(--sans);
  }
  .refresh-btn:hover { border-color: var(--cardinal-dark); color: var(--cardinal); }
  .refresh-btn:focus-visible { outline: 2px solid var(--cardinal); outline-offset: 2px; }

  .stat-strip {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .stat {
    flex: 1;
    padding: 16px 20px;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat .num {
    font-family: var(--mono);
    font-size: 26px;
    color: var(--cardinal);
    line-height: 1;
  }
  .stat .label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 3px;
    font-size: 14px;
    font-family: var(--sans);
  }
  .search-input:focus-visible { outline: 2px solid var(--cardinal); outline-offset: 1px; }
  .search-input::placeholder { color: var(--text-faint); }

  .toggle-flagged {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 10px 16px;
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    font-family: var(--sans);
  }
  .toggle-flagged.active {
    border-color: var(--digital-red);
    color: var(--digital-red);
    background: rgba(177, 4, 14, 0.08);
  }
  .toggle-flagged:focus-visible { outline: 2px solid var(--cardinal); outline-offset: 2px; }

  /* ---------- Ledger entries (companies) ---------- */
  .entry {
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 14px;
    background: var(--surface);
    overflow: hidden;
  }

  .entry-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }
  .entry-head:focus-visible { outline: 2px solid var(--cardinal); outline-offset: -2px; }

  .entry-title {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .entry-title .company {
    font-family: var(--serif);
    font-size: 18px;
    color: var(--text);
  }
  .entry-title .ticker {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--cardinal);
    letter-spacing: 0.5px;
  }

  .entry-meta {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
  }
  .entry-meta .price-move.up { color: var(--paloverde); }
  .entry-meta .price-move.down { color: var(--digital-red); }

  .chev {
    color: var(--text-faint);
    font-size: 11px;
    transition: transform 0.15s ease;
  }
  .entry.open .chev { transform: rotate(90deg); }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
  }
  .entry.open .entry-body { display: block; }

  .detail-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    padding: 14px 20px;
    background: var(--surface-raised);
    border-bottom: 1px solid var(--border);
  }
  .detail-strip .detail-item { display: flex; flex-direction: column; gap: 3px; }
  .detail-strip .detail-label {
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 10px;
  }
  .detail-strip .detail-value {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
  }

  .holder-header {
    display: grid;
    grid-template-columns: 26px 1.4fr 1fr 1fr 0.9fr 1.3fr;
    gap: 12px;
    padding: 9px 20px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border);
    background: var(--surface-raised);
  }

  .holder-row {
    display: grid;
    grid-template-columns: 26px 1.4fr 1fr 1fr 0.9fr 1.3fr;
    gap: 12px;
    padding: 13px 20px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
  }
  .holder-checkbox { accent-color: var(--cardinal); cursor: pointer; width: 15px; height: 15px; }
  .holder-row:last-child { border-bottom: none; }
  .holder-row.flagged { border-left: 3px solid var(--digital-red); background: rgba(177, 4, 14, 0.04); }

  .holder-name { color: var(--text); }
  .holder-name .qc-note {
    display: block;
    font-size: 11px;
    color: var(--digital-red);
    margin-top: 3px;
  }

  .holder-num { font-family: var(--mono); color: var(--text-dim); }

  /* Stamp: the signature element for Stanford confidence */
  .stamp {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .stamp-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.3px solid var(--cardinal-dark);
  }
  .stamp-dot.filled { background: var(--cardinal); border-color: var(--cardinal); }
  .stamp-label {
    margin-left: 6px;
    font-size: 11px;
    color: var(--text-faint);
    font-family: var(--mono);
  }
  .stamp[title] { cursor: help; border-bottom: 1px dotted var(--text-faint); padding-bottom: 1px; }

  .lockup-tag {
    font-size: 11.5px;
    color: var(--text-faint);
    font-family: var(--mono);
  }

  /* ---------- Selection bar & email modal (UI scaffold, not wired up yet) ---------- */
  .selection-bar {
    position: sticky;
    bottom: 16px;
    background: var(--cardinal);
    color: #FFFFFF;
    padding: 13px 20px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .selection-bar .count { font-family: var(--mono); }
  .selection-bar-actions { display: flex; gap: 8px; align-items: center; }
  .selection-bar button {
    background: #FFFFFF;
    color: var(--cardinal);
    border: none;
    padding: 8px 16px;
    border-radius: 3px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12.5px;
  }
  .selection-bar .clear-btn {
    background: none;
    color: #FFFFFF;
    font-weight: 400;
    text-decoration: underline;
    padding: 8px 4px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 15, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-box {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px;
    max-width: 460px;
    width: 100%;
  }
  .modal-box h3 {
    font-family: var(--serif);
    font-weight: 400;
    margin: 0 0 6px;
    font-size: 20px;
    color: var(--text);
  }
  .modal-box .modal-sub {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .modal-box .field-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-faint);
    display: block;
    margin-bottom: 6px;
  }
  .recipient-list {
    max-height: 150px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
  }
  .recipient-list .recipient-row { padding: 3px 0; }
  .modal-box input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 3px;
    font-size: 13px;
    margin-bottom: 16px;
    font-family: var(--sans);
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    padding: 9px 16px;
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--sans);
    border: 1px solid var(--border);
    background: none;
    color: var(--text-dim);
  }
  .modal-actions button.primary {
    background: var(--cardinal);
    color: #FFFFFF;
    border-color: var(--cardinal);
  }
  .modal-note {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 12px;
    line-height: 1.5;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }

  /* ---------- Empty / loading / error states ---------- */
  .state-panel {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 48px 32px;
    text-align: center;
    color: var(--text-dim);
  }
  .state-panel h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 19px;
    color: var(--text);
    margin: 0 0 8px;
  }
  .state-panel p { font-size: 14px; line-height: 1.6; margin: 0; color: var(--text-dim); }
  .state-panel .mono-hint {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 14px;
  }

  /* ---------- Setup form ---------- */
  .setup-form {
    max-width: 480px;
    margin: 60px auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 32px;
    background: var(--surface);
  }
  .setup-form h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 21px;
    margin: 0 0 6px;
  }
  .setup-form .desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 22px;
  }
  .field-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-faint);
    margin-bottom: 6px;
    display: block;
  }
  .setup-form input {
    width: 100%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 3px;
    font-size: 13px;
    font-family: var(--mono);
    margin-bottom: 18px;
  }
  .setup-form input:focus-visible { outline: 2px solid var(--cardinal); outline-offset: 1px; }
  .setup-form button {
    width: 100%;
    background: var(--cardinal);
    border: none;
    color: #FFFFFF;
    font-weight: 600;
    padding: 11px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
    font-family: var(--sans);
  }
  .setup-form button:hover { background: var(--cardinal-dark); }
  .setup-form button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .setup-form .privacy-note {
    font-size: 11.5px;
    color: var(--text-faint);
    line-height: 1.6;
    margin-top: 16px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  @media (max-width: 640px) {
    .holder-row, .holder-header { grid-template-columns: 22px 1fr 1fr; row-gap: 4px; }
    .holder-header span:nth-child(4), .holder-header span:nth-child(5),
    .holder-row > *:nth-child(5), .holder-row > *:nth-child(6) { display: none; }
    .entry-meta { display: none; }
    .detail-strip { gap: 16px; }
    .stat-strip { flex-wrap: wrap; }
    .stat { flex: 1 1 50%; border-bottom: 1px solid var(--border); }
    .selection-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">Loading&hellip;</div>

<script>
const COLUMNS = [
  "Company Name","Ticker","Filing Price","Actual Price","Current Price",
  "Holder Name","Shares","Cash Value","Stanford Grade","Stanford Justification",
  "Lock-Up Expiry","QC Status","QC Notes","Last Updated"
];

function getTheme() {
  return document.documentElement.getAttribute('data-theme') || 'light';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('ipo-ledger-theme', theme); } catch (e) { /* no-op */ }
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('ipo-ledger-theme'); } catch (e) { /* no-op */ }
  const preferred = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(preferred);
}

function toggleTheme() {
  applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
  render();
}

initTheme();

let state = {
  config: null,
  rows: [],
  loading: true,
  error: null,
  search: "",
  showFlaggedOnly: false,
  openCompanies: new Set(),
  selectedHolders: new Set(),
  showEmailModal: false,
};

function loadConfig() {
  try {
    const raw = localStorage.getItem('ipo-ledger-sheets-config');
    if (raw) return JSON.parse(raw);
  } catch (e) { /* not set yet, or storage unavailable */ }
  return null;
}

function saveConfig(cfg) {
  try {
    localStorage.setItem('ipo-ledger-sheets-config', JSON.stringify(cfg));
  } catch (e) { /* storage unavailable - config will need re-entry each visit */ }
}

function clearConfig() {
  try {
    localStorage.removeItem('ipo-ledger-sheets-config');
  } catch (e) { /* no-op */ }
}

function fmtMoney(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return '—';
  return '$' + n.toLocaleString('en-US', { maximumFractionDigits: n < 10 ? 4 : 2 });
}

function fmtShares(v) {
  const n = parseInt(String(v).replace(/,/g, ''), 10);
  if (isNaN(n)) return '—';
  return n.toLocaleString('en-US');
}

async function fetchSheetData(spreadsheetId, apiKey) {
  const range = encodeURIComponent("IPO Tracker!A1:N2000");
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`;
  const res = await fetch(url);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body?.error?.message || `Request failed (HTTP ${res.status})`);
  }
  const data = await res.json();
  const values = data.values || [];
  if (values.length < 2) return [];
  const header = values[0];
  return values.slice(1).map(row => {
    const obj = {};
    header.forEach((col, i) => { obj[col] = row[i] ?? ''; });
    return obj;
  });
}

function groupByCompany(rows) {
  const groups = {};
  rows.forEach(r => {
    const key = r['Ticker'] || r['Company Name'];
    if (!groups[key]) groups[key] = { company: r['Company Name'], ticker: r['Ticker'],
      filingPrice: r['Filing Price'], actualPrice: r['Actual Price'], currentPrice: r['Current Price'],
      dateOfFiling: r['Date of Filing'], dateOfPricing: r['Date of Pricing'],
      ipoSize: r['IPO Size (Shares)'], amountRaised: r['Amount Raised'],
      lockup: r['Lock-Up Expiry'], holders: [] };
    groups[key].holders.push(r);
  });
  return Object.values(groups);
}

const STANFORD_GRADE_RUBRIC =
  '0 = no evidence found. 1-2 = weak or ambiguous signal (name match only, no corroborating detail). ' +
  '3-4 = reasonably confident, corroborated by title/company/location/era. ' +
  '5 = directly confirmed in a bio or reliable source.';

function stampHtml(grade) {
  const g = parseInt(grade, 10) || 0;
  let dots = '';
  for (let i = 1; i <= 5; i++) {
    dots += `<span class="stamp-dot ${i <= g ? 'filled' : ''}"></span>`;
  }
  const label = g === 5 ? 'confirmed' : g === 0 ? 'none found' : 'partial';
  return `<span class="stamp" title="${STANFORD_GRADE_RUBRIC}">${dots}<span class="stamp-label">${label}</span></span>`;
}

function render() {
  const app = document.getElementById('app');

  if (state.loading) {
    app.innerHTML = `<div class="state-panel"><h2>Reading the ledger&hellip;</h2><p>Pulling the latest tracked filings.</p></div>`;
    return;
  }

  if (!state.config) {
    app.innerHTML = `
      <div class="setup-form">
        <h2>Connect the ledger</h2>
        <div class="desc">This dashboard reads directly from your IPO Tracker Google Sheet. It needs the sheet's ID and a read-only API key — it never writes anything back.</div>
        <label class="field-label" for="in-sheet">Spreadsheet ID</label>
        <input id="in-sheet" placeholder="from the sheet's URL" />
        <label class="field-label" for="in-key">Read-only API key</label>
        <input id="in-key" placeholder="Google Cloud API key" />
        <button id="btn-connect">Connect</button>
        <div id="setup-error" style="color: var(--digital-red); font-size: 12px; margin-top: 10px; display: none;"></div>
        <div class="privacy-note">Stored only in this browser's local storage on this device — never sent anywhere except directly to Google's Sheets API. The sheet must be set to "Anyone with the link can view" for this key to read it.</div>
      </div>`;
    document.getElementById('btn-connect').onclick = () => {
      const errorEl = document.getElementById('setup-error');
      const spreadsheetId = document.getElementById('in-sheet').value.trim();
      const apiKey = document.getElementById('in-key').value.trim();

      if (!spreadsheetId || !apiKey) {
        errorEl.textContent = !spreadsheetId && !apiKey
          ? 'Enter both the Spreadsheet ID and API key.'
          : !spreadsheetId
            ? 'Enter the Spreadsheet ID.'
            : 'Enter the API key.';
        errorEl.style.display = 'block';
        return;
      }

      errorEl.style.display = 'none';
      state.config = { spreadsheetId, apiKey };
      saveConfig(state.config);
      init();
    };
    return;
  }

  if (state.error) {
    app.innerHTML = `
      <div class="state-panel">
        <h2>Couldn't reach the sheet</h2>
        <p>${state.error}</p>
        <div class="mono-hint">Check the API key is restricted to Sheets API and the sheet allows link-viewers.</div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <button class="refresh-btn" id="btn-retry">Try again</button>
        <button class="refresh-btn" id="btn-reset" style="margin-left:8px;">Reset connection</button>
      </div>`;
    document.getElementById('btn-retry').onclick = () => init();
    document.getElementById('btn-reset').onclick = () => {
      state.config = null;
      clearConfig();
      render();
    };
    return;
  }

  const totalCompanies = new Set(state.rows.map(r => r['Ticker'])).size;
  const flaggedCount = state.rows.filter(r => r['QC Status'] === 'Needs Review').length;
  const confirmedStanford = state.rows.filter(r => parseInt(r['Stanford Grade'], 10) === 5).length;

  let filtered = state.rows;
  if (state.showFlaggedOnly) filtered = filtered.filter(r => r['QC Status'] === 'Needs Review');
  if (state.search.trim()) {
    const q = state.search.toLowerCase();
    filtered = filtered.filter(r =>
      (r['Company Name'] || '').toLowerCase().includes(q) ||
      (r['Ticker'] || '').toLowerCase().includes(q) ||
      (r['Holder Name'] || '').toLowerCase().includes(q)
    );
  }

  const groups = groupByCompany(filtered);

  let entriesHtml;
  if (groups.length === 0) {
    entriesHtml = `
      <div class="state-panel">
        <h2>${state.rows.length === 0 ? 'No filings tracked yet' : 'Nothing matches'}</h2>
        <p>${state.rows.length === 0
          ? 'The daily pipeline checks SEC EDGAR each morning for newly priced IPOs. This ledger fills in as real filings come through.'
          : 'Try a different search term, or clear the flagged-only filter.'}</p>
      </div>`;
  } else {
    entriesHtml = groups.map((g, idx) => {
      const isOpen = state.openCompanies.has(g.ticker);
      const holdersHtml = g.holders.map(h => {
        const holderKey = `${g.ticker}::${h['Holder Name']}`;
        const isChecked = state.selectedHolders.has(holderKey);
        return `
        <div class="holder-row ${h['QC Status'] === 'Needs Review' ? 'flagged' : ''}">
          <input type="checkbox" class="holder-checkbox" data-holder-key="${holderKey}" ${isChecked ? 'checked' : ''} aria-label="Select ${h['Holder Name'] || 'holder'} for email" />
          <div class="holder-name">${h['Holder Name'] || '—'}${
            h['QC Status'] === 'Needs Review' && h['QC Notes']
              ? `<span class="qc-note">${h['QC Notes']}</span>` : ''
          }</div>
          <div class="holder-num">${fmtShares(h['Shares'])} sh</div>
          <div class="holder-num">${fmtMoney(h['Cash Value'])}</div>
          <div>${stampHtml(h['Stanford Grade'])}</div>
          <div class="lockup-tag">${h['Lock-Up Expiry'] || '—'}</div>
        </div>`;
      }).join('');

      const priceMoveClass = (parseFloat(g.currentPrice) >= parseFloat(g.actualPrice)) ? 'up' : 'down';

      const detailStripHtml = `
        <div class="detail-strip">
          <div class="detail-item"><span class="detail-label">Filed</span><span class="detail-value">${g.dateOfFiling || '—'}</span></div>
          <div class="detail-item"><span class="detail-label">Priced</span><span class="detail-value">${g.dateOfPricing || '—'}</span></div>
          <div class="detail-item"><span class="detail-label">IPO Size</span><span class="detail-value">${g.ipoSize ? fmtShares(g.ipoSize) + ' sh' : '—'}</span></div>
          <div class="detail-item"><span class="detail-label">Amount Raised</span><span class="detail-value">${fmtMoney(g.amountRaised)}</span></div>
        </div>`;

      return `
        <div class="entry ${isOpen ? 'open' : ''}" data-ticker="${g.ticker}">
          <div class="entry-head" tabindex="0" role="button" aria-expanded="${isOpen}">
            <div class="entry-title">
              <span class="chev">&#9656;</span>
              <span class="company">${g.company}</span>
              <span class="ticker">${g.ticker}</span>
            </div>
            <div class="entry-meta">
              <span>IPO ${fmtMoney(g.actualPrice)}</span>
              <span class="price-move ${priceMoveClass}">now ${fmtMoney(g.currentPrice)}</span>
              <span>${g.holders.length} holder${g.holders.length === 1 ? '' : 's'}</span>
            </div>
          </div>
          <div class="entry-body">
            ${detailStripHtml}
            <div class="holder-header">
              <span></span><span>Holder</span><span>Shares</span><span>Cash Value</span><span>Stanford</span><span>Lock-Up</span>
            </div>
            ${holdersHtml}
          </div>
        </div>`;
    }).join('');
  }

  app.innerHTML = `
    <div class="masthead">
      <div>
        <h1>IPO Ledger</h1>
        <div class="sub">Beneficial ownership &amp; Stanford affiliation tracker</div>
      </div>
      <div>
        <button class="theme-toggle" id="btn-theme-toggle">${getTheme() === 'dark' ? '☀ Light' : '☾ Dark'}</button>
        <button class="refresh-btn" id="btn-refresh">&#8635; Refresh</button>
      </div>
    </div>

    <div class="stat-strip">
      <div class="stat"><div class="num">${totalCompanies}</div><div class="label">Companies tracked</div></div>
      <div class="stat"><div class="num">${state.rows.length}</div><div class="label">Holders logged</div></div>
      <div class="stat"><div class="num">${confirmedStanford}</div><div class="label">Confirmed Stanford</div></div>
      <div class="stat"><div class="num" style="color:${flaggedCount ? 'var(--digital-red)' : 'var(--cardinal)'}">${flaggedCount}</div><div class="label">Flagged for review</div></div>
    </div>

    <div class="controls">
      <input class="search-input" id="in-search" placeholder="Search company, ticker, or holder&hellip;" value="${state.search}" />
      <button class="toggle-flagged ${state.showFlaggedOnly ? 'active' : ''}" id="btn-toggle-flagged">Flagged only</button>
    </div>

    ${entriesHtml}

    ${state.selectedHolders.size > 0 ? `
      <div class="selection-bar">
        <span class="count">${state.selectedHolders.size} holder${state.selectedHolders.size === 1 ? '' : 's'} selected</span>
        <div class="selection-bar-actions">
          <button class="clear-btn" id="btn-clear-selection">Clear</button>
          <button id="btn-email-selected">Email Selected</button>
        </div>
      </div>` : ''}

    ${state.showEmailModal ? `
      <div class="modal-overlay" id="email-modal-overlay">
        <div class="modal-box">
          <h3>Email selected holders</h3>
          <div class="modal-sub">Sends a summary of the selected holders' details to the address below.</div>
          <label class="field-label">Recipients (${state.selectedHolders.size})</label>
          <div class="recipient-list">
            ${Array.from(state.selectedHolders).map(k => `<div class="recipient-row">${k.split('::')[1]} — ${k.split('::')[0]}</div>`).join('')}
          </div>
          <label class="field-label">Send to</label>
          <input id="in-email-to" type="email" placeholder="name@example.com" />
          <div class="modal-actions">
            <button id="btn-modal-cancel">Cancel</button>
            <button class="primary" id="btn-modal-send">Send</button>
          </div>
          <div class="modal-note">Sending isn't wired up yet — this records the intended recipient and selection so the send action can be connected later.</div>
        </div>
      </div>` : ''}
  `;

  document.getElementById('btn-refresh').onclick = () => init(true);
  document.getElementById('btn-theme-toggle').onclick = () => toggleTheme();
  const searchInput = document.getElementById('in-search');
  searchInput.oninput = (e) => { state.search = e.target.value; render(); };
  searchInput.focus();
  searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;

  document.getElementById('btn-toggle-flagged').onclick = () => {
    state.showFlaggedOnly = !state.showFlaggedOnly;
    render();
  };

  document.querySelectorAll('.entry-head').forEach(el => {
    const toggle = () => {
      const ticker = el.parentElement.getAttribute('data-ticker');
      if (state.openCompanies.has(ticker)) state.openCompanies.delete(ticker);
      else state.openCompanies.add(ticker);
      render();
    };
    el.onclick = toggle;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  });

  document.querySelectorAll('.holder-checkbox').forEach(cb => {
    cb.onclick = (e) => e.stopPropagation();
    cb.onchange = (e) => {
      const key = e.target.getAttribute('data-holder-key');
      if (e.target.checked) state.selectedHolders.add(key);
      else state.selectedHolders.delete(key);
      render();
    };
  });

  const clearBtn = document.getElementById('btn-clear-selection');
  if (clearBtn) clearBtn.onclick = () => { state.selectedHolders.clear(); render(); };

  const emailBtn = document.getElementById('btn-email-selected');
  if (emailBtn) emailBtn.onclick = () => { state.showEmailModal = true; render(); };

  const modalOverlay = document.getElementById('email-modal-overlay');
  if (modalOverlay) {
    modalOverlay.onclick = (e) => { if (e.target === modalOverlay) { state.showEmailModal = false; render(); } };
    document.getElementById('btn-modal-cancel').onclick = () => { state.showEmailModal = false; render(); };
    document.getElementById('btn-modal-send').onclick = () => {
      const to = document.getElementById('in-email-to').value.trim();
      if (!to) {
        document.getElementById('in-email-to').focus();
        return;
      }
      // Placeholder only - no backend wired up yet. This is where a
      // future integration (e.g. a mail API call) would be triggered.
      alert(`This would send details for ${state.selectedHolders.size} holder(s) to ${to} once email sending is connected.`);
      state.showEmailModal = false;
      state.selectedHolders.clear();
      render();
    };
  }
}

async function init(forceRefresh) {
  state.loading = true;
  state.error = null;
  render();

  if (!state.config) {
    state.config = loadConfig();
  }
  if (!state.config) {
    state.loading = false;
    render();
    return;
  }

  try {
    state.rows = await fetchSheetData(state.config.spreadsheetId, state.config.apiKey);
  } catch (e) {
    state.error = (e && e.message) ? e.message : String(e);
  }
  state.loading = false;
  render();
}

window.addEventListener('error', (e) => {
  const app = document.getElementById('app');
  if (app && !app.innerHTML.trim()) {
    app.innerHTML = `<div class="state-panel"><h2>Something went wrong</h2><p>${e.message || 'Unknown error'}</p></div>`;
  }
});

init();
</script>
</body>
</html>
